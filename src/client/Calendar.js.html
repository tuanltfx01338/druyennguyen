<script>
'use strict';
/* Lịch hẹn kiểu Outlook: Ngày / Tuần (lưới giờ) · Tháng (ô ngày). */
const APPT_STATUS = {
  scheduled: { label: 'Đã hẹn', icon: '🕒' },
  arrived: { label: 'Đã đến', icon: '✓' },
  no_show: { label: 'Không đến', icon: '✗' },
  cancelled: { label: 'Đã huỷ', icon: '⊘' },
};
const WD = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
const WD_LONG = ['Chủ nhật', 'Thứ hai', 'Thứ ba', 'Thứ tư', 'Thứ năm', 'Thứ sáu', 'Thứ bảy'];
const HOUR_PX = 48;              // 30-minute row = 24px
const DAY_START_H = 6, DAY_END_H = 21; // clinic view 06:00–21:00 (grid widens if a booking falls outside)
const PX_PER_MIN = HOUR_PX / 60;
const DURATIONS = [15, 30, 45, 60, 90, 120];

const toDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const toStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const shiftDays = (s, n) => { const d = toDate(s); d.setDate(d.getDate() + n); return toStr(d); };
const mondayOf = s => { const d = toDate(s); return shiftDays(s, -((d.getDay() + 6) % 7)); };
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const minToTime = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
const endTimeOf = a => a.start_time && a.duration_min ? minToTime(toMin(a.start_time) + Number(a.duration_min)) : '';
const fmtDayLong = s => { const d = toDate(s); return `${WD_LONG[d.getDay()]}, ${fmtDate(s)}`; };
// Vietnamese given name = last word ("Nguyễn Văn An" → "An"): fits narrow week/month cells.
const shortName = n => String(n).trim().split(/\s+/).slice(-2).join(' ');
const apptTimeText = a => a.start_time ? `${a.start_time}–${endTimeOf(a)} (${a.duration_min}')` : 'Chưa đặt giờ';

const calState = { view: window.innerWidth < 600 ? 'day' : 'week', date: todayStr(), scroll: null };
let pendingAppt = null; // prefill for the appointment form
let pendingVisit = null; // { fromAppt } when recording an appointment's result

/** Open the visit form to record the exam result of an appointment (prefilled; links back on save). */
function recordResult(a) { pendingVisit = { fromAppt: a }; go('p/' + a.patient_id + '/v/new'); }
function openCalendar(view, date) { if (view) calState.view = view; if (date) calState.date = date; calState.scroll = null; go('calendar'); }
function newAppointment(prefill) { pendingAppt = prefill || {}; go('a/new'); }

/** Side-by-side columns for overlapping events (Outlook-style). Returns [{a, col, cols}]. */
function layoutDay(events) {
  const timed = events.filter(a => a.start_time).map(a => ({ a, s: toMin(a.start_time), e: toMin(a.start_time) + Math.max(Number(a.duration_min) || 15, 15) }))
    .sort((x, y) => x.s - y.s || y.e - x.e);
  const out = [];
  let cluster = [], colsEnd = [], clusterEnd = -1;
  const flush = () => { cluster.forEach(c => { c.cols = colsEnd.length; out.push(c); }); cluster = []; colsEnd = []; };
  for (const ev of timed) {
    if (ev.s >= clusterEnd) { flush(); clusterEnd = -1; }
    let col = colsEnd.findIndex(end => end <= ev.s);
    if (col < 0) { col = colsEnd.length; colsEnd.push(ev.e); } else colsEnd[col] = ev.e;
    ev.col = col; cluster.push(ev); clusterEnd = Math.max(clusterEnd, ev.e);
  }
  flush();
  return out;
}

/** Ids of timed, non-cancelled appointments that overlap another one on the same day. */
function conflictIds(appts) {
  const ids = new Set();
  const byDay = {};
  appts.filter(a => a.start_time && a.duration_min && a.status !== 'cancelled')
    .forEach(a => (byDay[a.appt_date] = byDay[a.appt_date] || []).push({ a, s: toMin(a.start_time), e: toMin(a.start_time) + Number(a.duration_min) }));
  Object.values(byDay).forEach(list => {
    list.sort((x, y) => x.s - y.s);
    for (let i = 0; i < list.length; i++)
      for (let j = i + 1; j < list.length && list[j].s < list[i].e; j++) { ids.add(list[i].a.appt_id); ids.add(list[j].a.appt_id); }
  });
  return ids;
}
const conflictPartners = (a, appts) => appts.filter(b => b.appt_id !== a.appt_id && b.appt_date === a.appt_date && b.start_time && b.duration_min
  && b.status !== 'cancelled' && toMin(b.start_time) < toMin(a.start_time) + Number(a.duration_min) && toMin(a.start_time) < toMin(b.start_time) + Number(b.duration_min));

let calAppts = []; // appointments of the visible range (for conflict lookups in the sheet)

async function pageCalendar() {
  const { view } = calState;
  const today = todayStr();
  let from, to, title, sub = '';
  if (view === 'day') { from = to = calState.date; const d = toDate(from); title = `${WD_LONG[d.getDay()]} ${d.getDate()}/${d.getMonth() + 1}`; sub = String(d.getFullYear()); }
  else if (view === 'week') { from = mondayOf(calState.date); to = shiftDays(from, 6); title = `${fmtDate(from).slice(0, 5)} – ${fmtDate(to).slice(0, 5)}`; sub = 'Tuần ' + fmtDate(to).slice(6); }
  else {
    const d = toDate(calState.date);
    from = mondayOf(toStr(new Date(d.getFullYear(), d.getMonth(), 1)));
    to = shiftDays(from, 41);
    title = `Tháng ${d.getMonth() + 1}`; sub = String(d.getFullYear());
  }
  const step = n => {
    if (view === 'day') calState.date = shiftDays(calState.date, n);
    else if (view === 'week') calState.date = shiftDays(calState.date, 7 * n);
    else { const d = toDate(calState.date); calState.date = toStr(new Date(d.getFullYear(), d.getMonth() + n, 1)); }
    calState.scroll = null;
    pageCalendar();
  };
  const seg = h('div', { class: 'seg cal-seg' }, [['day', 'Ngày'], ['week', 'Tuần'], ['month', 'Tháng']].map(([k, l]) =>
    h('button', { class: k === view ? 'active' : '', onclick: () => { calState.view = k; calState.scroll = null; pageCalendar(); } }, l)));
  const summary = h('div', { class: 'cal-summary' });
  const body = h('div', { class: 'cal-body' }, h('div', { class: 'loading' }, 'Đang tải lịch…'));
  let touchX = null;
  mount(
    h('div', { class: 'cal-toolbar' },
      h('div', { class: 'cal-when' },
        h('div', { class: 'cal-stepper' },
          h('button', { onclick: () => step(-1), 'aria-label': 'Trước' }, '‹'),
          h('button', { class: 'cal-today', onclick: () => { calState.date = today; calState.scroll = null; pageCalendar(); } }, 'Hôm nay'),
          h('button', { onclick: () => step(1), 'aria-label': 'Sau' }, '›')),
        h('div', { class: 'cal-title' }, h('b', {}, title), h('span', {}, sub))),
      h('div', { class: 'cal-tools' }, seg,
        h('button', { class: 'primary', onclick: () => newAppointment({ appt_date: view === 'day' ? calState.date : '' }) }, '+ Lịch hẹn'))),
    summary,
    h('div', { ontouchstart: e => { touchX = dragState ? null : e.touches[0].clientX; },
      ontouchend: e => { if (touchX == null || dragState) return; const dx = e.changedTouches[0].clientX - touchX; touchX = null; if (Math.abs(dx) > 80) step(dx > 0 ? -1 : 1); } }, body));

  let appts;
  try { appts = await api('listAppointments', from, to); } catch (e) { return body.replaceChildren(errBox(e, pageCalendar)); }
  calAppts = appts;
  const conflicts = conflictIds(appts);
  const active = appts.filter(a => a.status !== 'cancelled');
  summary.replaceChildren(...[
    h('span', {}, h('b', {}, active.length), ' lịch hẹn'),
    h('span', {}, h('b', {}, appts.filter(a => a.result_visit_id).length), ' đã ghi kết quả'),
    conflicts.size ? h('span', { class: 'sum-warn' }, '⚠ ', h('b', {}, conflicts.size), ' hẹn bị trùng giờ') : h('span', { class: 'sum-ok' }, '✓ Không trùng giờ'),
    view !== 'month' ? h('span', { class: 'sum-hint' }, 'Kéo khối hẹn để đổi giờ · kéo mép dưới để đổi thời lượng') : null].filter(Boolean));
  if (view === 'month') body.replaceChildren(monthView(from, appts, today, conflicts));
  else {
    const days = view === 'day' ? [from] : Array.from({ length: 7 }, (_, i) => shiftDays(from, i));
    body.replaceChildren(timeGrid(days, appts, today, conflicts));
    const scroller = body.querySelector('.tg-scroll');
    if (calState.scroll != null) scroller.scrollTop = calState.scroll; // keep position after an edit
    else {
      // open on the first double-booking if any (it needs attention), otherwise on the first appointment
      const pickFrom = appts.filter(a => a.start_time && conflicts.has(a.appt_id)).length ? appts.filter(a => conflicts.has(a.appt_id)) : appts;
      const first = pickFrom.filter(a => a.start_time).map(a => toMin(a.start_time)).sort((x, y) => x - y)[0];
      const base = Number(scroller.dataset.base);
      if (first != null) scroller.scrollTop = Math.max(0, (first - base - 30) * PX_PER_MIN);
    }
  }
}

function apptClass(a, conflicts) {
  return 'ev st-' + (a.status || 'scheduled') + (a.result_visit_id ? ' has-result' : '') + (conflicts && conflicts.has(a.appt_id) ? ' conflict' : '');
}

function timeGrid(days, appts, today, conflicts) {
  const multi = days.length > 1;
  const timed = appts.filter(a => a.start_time);
  const startH = Math.min(DAY_START_H, ...timed.map(a => Math.floor(toMin(a.start_time) / 60)));
  const endH = Math.min(24, Math.max(DAY_END_H, ...timed.map(a => Math.ceil((toMin(a.start_time) + (Number(a.duration_min) || 15)) / 60))));
  const base = startH * 60;
  const nowMin = new Date().getHours() * 60 + new Date().getMinutes();

  const head = h('div', { class: 'tg-head' }, h('div', { class: 'tg-gutter' }),
    days.map(d => {
      const dt = toDate(d);
      const dayAppts = appts.filter(a => a.appt_date === d && a.status !== 'cancelled');
      const nConf = dayAppts.filter(a => conflicts.has(a.appt_id)).length;
      return h('button', { class: 'tg-day' + (d === today ? ' today' : '') + (dt.getDay() === 0 ? ' sunday' : ''), onclick: () => openCalendar('day', d) },
        h('span', { class: 'wd' }, WD[dt.getDay()]), h('b', {}, dt.getDate()),
        h('span', { class: 'cnt' + (nConf ? ' warn' : '') }, nConf ? `⚠ ${nConf}` : dayAppts.length ? `${dayAppts.length} hẹn` : ''));
    }));
  const allDay = h('div', { class: 'tg-allday' }, h('div', { class: 'tg-gutter' }, 'Chưa giờ'),
    days.map(d => h('div', { class: 'tg-allday-col' }, appts.filter(a => a.appt_date === d && !a.start_time).map(a =>
      h('button', { class: apptClass(a) + ' chip-ev', onclick: () => apptSheet(a) }, multi ? shortName(a.full_name) : a.full_name + (a.title ? ' · ' + a.title : ''))))));
  const gutter = h('div', { class: 'tg-gutter tg-times' },
    Array.from({ length: endH - startH }, (_, i) => h('div', { class: 'tg-hour', style: `height:${HOUR_PX}px` }, h('span', {}, i ? pad(startH + i) + ':00' : ''))));
  if (days.includes(today) && nowMin >= base && nowMin <= endH * 60)
    gutter.append(h('span', { class: 'now-pill', style: `top:${(nowMin - base) * PX_PER_MIN}px` }, minToTime(nowMin)));

  const colEls = [];
  const cols = days.map((d, di) => {
    const col = h('div', { class: 'tg-col' + (d === today ? ' today' : ''), style: `height:${(endH - startH) * HOUR_PX}px`,
      onclick: e => {
        if (e.target !== col || dragState) return;
        const min = base + Math.floor(e.offsetY / PX_PER_MIN / 30) * 30;
        newAppointment({ appt_date: d, start_time: minToTime(min) });
      } });
    colEls.push(col);
    layoutDay(appts.filter(a => a.appt_date === d)).forEach(({ a, s, e, col: c, cols: n }) => {
      const height = Math.max((e - s) * PX_PER_MIN - 2, 20);
      const isConf = conflicts.has(a.appt_id);
      const compact = height < 44;
      const ev = h('div', { class: apptClass(a, conflicts) + (multi && n >= 3 && window.innerWidth < 720 ? ' narrow' : '') + (compact ? ' compact' : ''), role: 'button', tabindex: 0,
        'aria-label': `${a.start_time}–${endTimeOf(a)} ${a.full_name}${isConf ? ', trùng giờ' : ''}`,
        style: `top:${(s - base) * PX_PER_MIN + 1}px;height:${height}px;left:calc(${(c / n) * 100}% + 2px);width:calc(${100 / n}% - 4px)`,
        onkeydown: k => { if (k.key === 'Enter') apptSheet(a); } },
        h('div', { class: 'ev-top' },
          h('span', { class: 'ev-t' }, multi ? a.start_time : `${a.start_time}–${endTimeOf(a)}`),
          isConf ? h('span', { class: 'ev-flag' }, '⚠') : a.result_visit_id ? h('span', { class: 'ev-flag ok' }, '✓') : null),
        h('div', { class: 'ev-n' }, !multi && !compact ? avatar(a, 20) : null,
          h('span', {}, compact && multi ? (isConf ? '⚠' : '') + a.start_time   // too short for a name in week view
            : (compact ? a.start_time + ' ' : '') + (isConf && compact ? '⚠ ' : '') + (multi ? shortName(a.full_name) : a.full_name))),
        a.title && height > 58 ? h('div', { class: 'ev-d' }, a.title) : null,
        isConf && !multi && height > 76 ? h('div', { class: 'ev-warn' }, 'Trùng giờ') : null,
        a.status !== 'cancelled' ? h('div', { class: 'ev-resize', title: 'Kéo để đổi thời lượng' }) : null);
      enableDrag(ev, a, { days, di, base, endMin: endH * 60, colEls, multi });
      col.append(ev);
    });
    if (d === today && nowMin >= base && nowMin <= endH * 60) col.append(h('div', { class: 'now-line', style: `top:${(nowMin - base) * PX_PER_MIN}px` }));
    return col;
  });
  const scroller = h('div', { class: 'tg-scroll', 'data-base': base }, h('div', { class: 'tg-grid' }, gutter, cols));
  return h('div', { class: 'tg' + (multi ? ' week' : ' dayview') }, head, allDay, scroller);
}

/* ---------- drag to move / resize (15-minute snap) ---------- */
const SNAP = 15;
let dragState = null;
let justDragged = false;
const blockTouchScroll = e => { if (dragState && dragState.active) e.preventDefault(); };

function enableDrag(el, a, g) {
  if (a.status === 'cancelled') { el.addEventListener('click', () => apptSheet(a)); return; }
  const dur0 = Number(a.duration_min) || 30, start0 = toMin(a.start_time);
  el.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    const mode = e.target.classList.contains('ev-resize') ? 'resize' : 'move';
    const st = dragState = { a, mode, x0: e.clientX, y0: e.clientY, active: false, moved: false, el, pid: e.pointerId, start: start0, dur: dur0, di: g.di, ptype: e.pointerType };
    const activate = st.activate = () => {
      if (dragState !== st) return;
      st.active = true;
      el.classList.add('dragging');
      try { el.setPointerCapture(st.pid); } catch (_) { /* pointer gone */ }
      st.label = h('div', { class: 'drag-label' });
      el.append(st.label);
      showLabel();
      if (navigator.vibrate) try { navigator.vibrate(15); } catch (_) {}
    };
    // Touch: hold 350ms to pick up the block (a normal swipe keeps scrolling). Mouse/pen: start once it moves.
    if (e.pointerType === 'touch') st.timer = setTimeout(activate, 350);
    document.addEventListener('touchmove', blockTouchScroll, { passive: false });
  });
  const showLabel = () => {
    const st = dragState;
    st.label.textContent = `${g.multi ? WD[toDate(g.days[st.di]).getDay()] + ' ' : ''}${minToTime(st.start)}–${minToTime(st.start + st.dur)} (${st.dur}')`;
  };
  el.addEventListener('pointermove', e => {
    const st = dragState;
    if (!st || st.el !== el) return;
    const dx = e.clientX - st.x0, dy = e.clientY - st.y0;
    if (!st.active) {
      const far = Math.abs(dx) > 6 || Math.abs(dy) > 6;
      if (!far) return;
      if (st.ptype === 'touch') { clearTimeout(st.timer); dragState = null; return; } // it was a scroll
      st.activate();
    }
    e.preventDefault();
    const dMin = Math.round(dy / PX_PER_MIN / SNAP) * SNAP;
    if (st.mode === 'resize') {
      st.dur = Math.max(SNAP, Math.min(dur0 + dMin, g.endMin - start0));
      el.style.height = `${st.dur * PX_PER_MIN - 2}px`;
    } else {
      st.start = Math.max(g.base, Math.min(start0 + dMin, g.endMin - dur0));
      el.style.top = `${(st.start - g.base) * PX_PER_MIN + 1}px`;
      if (g.multi) {
        const colW = g.colEls[0].getBoundingClientRect().width || 1;
        const di = Math.max(0, Math.min(g.days.length - 1, g.di + Math.round(dx / colW)));
        if (di !== st.di) { st.di = di; g.colEls[di].append(el); }
        el.style.left = '2px'; el.style.width = 'calc(100% - 4px)';
      }
    }
    st.moved = st.start !== start0 || st.dur !== dur0 || st.di !== g.di;
    showLabel();
  });
  const finish = async cancelled => {
    const st = dragState;
    document.removeEventListener('touchmove', blockTouchScroll);
    if (!st || st.el !== el) return;
    clearTimeout(st.timer);
    dragState = null;
    if (!st.active) return;                     // a tap → the click handler opens the sheet
    justDragged = true; setTimeout(() => { justDragged = false; }, 0);
    el.classList.remove('dragging');
    if (cancelled || !st.moved) { calState.scroll = currentScroll(); return pageCalendar(); }
    const before = { appt_date: a.appt_date, start_time: a.start_time, duration_min: a.duration_min };
    const after = { appt_date: g.days[st.di], start_time: minToTime(st.start), duration_min: st.dur };
    await moveAppointment(a, after, before);
  };
  el.addEventListener('click', () => { if (!justDragged) apptSheet(a); });
  el.addEventListener('pointerup', () => finish(false));
  el.addEventListener('pointercancel', () => finish(true));
}
const currentScroll = () => { const s = document.querySelector('.tg-scroll'); return s ? s.scrollTop : null; };

/** Saves a new date/time/duration; warns on overlap and offers undo. */
async function moveAppointment(a, after, before) {
  calState.scroll = currentScroll();
  try {
    const r = await api('saveAppointment', { ...a, ...after });
    const undo = { label: 'Hoàn tác', onClick: async () => {
      try { await api('saveAppointment', { ...a, ...before }); toast('Đã hoàn tác'); calState.scroll = currentScroll(); pageCalendar(); }
      catch (e) { toast(errMsg(e), 'error'); }
    } };
    const when = `${fmtDate(after.appt_date).slice(0, 5)} ${after.start_time}–${minToTime(toMin(after.start_time) + Number(after.duration_min))}`;
    if (r.conflicts.length) toast(`⚠ ${a.full_name} ${when} trùng giờ với ${r.conflicts.join(', ')}`, 'warn', undo);
    else toast(`Đã dời ${a.full_name} sang ${when}`, '', undo);
  } catch (e) { toast(errMsg(e), 'error'); }
  pageCalendar();
}

function monthView(from, appts, today, conflicts) {
  const month = toDate(calState.date).getMonth();
  const cells = Array.from({ length: 42 }, (_, i) => {
    const d = shiftDays(from, i);
    const dt = toDate(d);
    const list = appts.filter(a => a.appt_date === d && a.status !== 'cancelled');
    const nConf = list.filter(a => conflicts.has(a.appt_id)).length;
    return h('div', { class: 'mv-cell' + (dt.getMonth() !== month ? ' other' : '') + (d === today ? ' today' : '') + (nConf ? ' has-conflict' : ''),
      onclick: () => openCalendar('day', d) },
      h('div', { class: 'mv-top' }, h('span', { class: 'mv-date' }, dt.getDate()),
        nConf ? h('span', { class: 'mv-warn', title: `${nConf} hẹn trùng giờ` }, '⚠ ' + nConf) : list.length > 3 ? h('span', { class: 'mv-count' }, list.length) : null),
      list.slice(0, 3).map(a => h('button', { class: apptClass(a, conflicts) + ' mv-ev', onclick: e => { e.stopPropagation(); apptSheet(a); } },
        h('span', { class: 'tnum' }, a.start_time || '•'), h('span', { class: 'mv-name' }, ' ' + shortName(a.full_name)))),
      list.length > 3 ? h('div', { class: 'mv-more' }, `+${list.length - 3} nữa`) : null);
  });
  return h('div', { class: 'mv' },
    h('div', { class: 'mv-head' }, ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'].map(w => h('div', {}, w))),
    h('div', { class: 'mv-grid' }, cells));
}

/** Bottom sheet: details, conflict warning, quick reschedule (no page change), status, result. */
function apptSheet(a) {
  const close = () => wrap.remove();
  const refresh = () => { calState.scroll = currentScroll(); render(currentPath()); };
  const setStatus = async st => {
    try { await api('setAppointmentStatus', a.appt_id, st); toast(APPT_STATUS[st].label); close(); refresh(); }
    catch (e) { toast(errMsg(e), 'error'); }
  };
  const st = APPT_STATUS[a.status] || APPT_STATUS.scheduled;
  const partners = curPath === 'calendar' ? conflictPartners(a, calAppts) : [];

  // quick reschedule
  const qDate = h('input', { type: 'date', value: a.appt_date });
  const qTime = h('input', { type: 'time', value: a.start_time || '', step: 300, min: '06:00', max: '21:00' });
  let qDur = a.duration_min ? String(a.duration_min) : '';
  const qDurPick = durationPicker(qDur, v => { qDur = v; });
  const quick = h('div', { class: 'quick-edit hidden' },
    h('div', { class: 'quick-row' }, h('label', {}, 'Ngày', qDate), h('label', {}, 'Giờ', qTime)),
    h('label', {}, 'Thời lượng'), qDurPick.el,
    h('div', { class: 'row-actions', style: 'margin:8px 0 0' },
      h('button', { class: 'primary', onclick: async () => {
        if (qTime.value && !qDur) return toast('Nhập thời lượng', 'warn');
        close();
        await moveAppointment(a, { appt_date: qDate.value, start_time: qTime.value, duration_min: qTime.value ? Number(qDur) : '' },
          { appt_date: a.appt_date, start_time: a.start_time, duration_min: a.duration_min });
      } }, 'Lưu giờ mới'),
      h('button', { onclick: () => quick.classList.add('hidden') }, 'Đóng')));

  const wrap = h('div', { class: 'sheet-wrap', onclick: e => { if (e.target === wrap) close(); } },
    h('div', { class: 'sheet' + (partners.length ? ' sheet-conflict' : '') },
      h('div', { class: 'sheet-grip' }),
      h('div', { class: 'visit-head' }, h('div', { class: 'row-av' }, avatar(a, 52),
        h('div', {}, h('h3', { style: 'margin:0' }, a.full_name), h('div', { class: 'muted' }, `${st.icon} ${st.label}`))),
        h('button', { class: 'icon-btn', onclick: close, 'aria-label': 'Đóng' }, '✕')),
      h('div', { class: 'sheet-when' }, h('b', {}, a.start_time ? `${a.start_time}–${endTimeOf(a)}` : 'Chưa đặt giờ'),
        h('span', {}, fmtDayLong(a.appt_date) + (a.duration_min ? ` · ${a.duration_min} phút` : ''))),
      partners.length ? h('div', { class: 'alert warn-box' }, '⚠ Trùng giờ với ',
        partners.map((p, i) => [i ? ', ' : '', h('b', {}, p.full_name), ` (${p.start_time}–${endTimeOf(p)})`]),
        h('div', { style: 'font-weight:400;margin-top:4px' }, 'Đổi giờ để tránh trùng: bấm "Đổi giờ" hoặc kéo khối hẹn trên lịch.')) : null,
      a.allergies ? h('div', { class: 'alert' }, '⚠ Dị ứng: ' + a.allergies) : null,
      kv([['Nội dung', a.title], ['Ghi chú', a.notes], ['SĐT', phonesOf(a).join('\n')]]),
      a.result_visit_id
        ? h('button', { class: 'primary big-cta', onclick: () => { close(); go('v/' + a.result_visit_id); } }, '📄 Xem / bổ sung kết quả khám')
        : a.status !== 'cancelled' ? h('button', { class: 'primary big-cta', onclick: () => { close(); recordResult(a); } }, '📝 Ghi kết quả khám & tải ảnh') : null,
      h('div', { class: 'row-actions' },
        a.status !== 'cancelled' ? h('button', { onclick: () => quick.classList.toggle('hidden') }, '🕒 Đổi giờ') : null,
        a.status !== 'arrived' ? h('button', { onclick: () => setStatus('arrived') }, '✓ Đã đến') : null,
        a.status !== 'no_show' ? h('button', { onclick: () => setStatus('no_show') }, '✗ Không đến') : null,
        a.status !== 'cancelled' ? h('button', { onclick: () => setStatus('cancelled') }, '⊘ Huỷ hẹn') : h('button', { onclick: () => setStatus('scheduled') }, 'Khôi phục')),
      quick,
      h('div', { class: 'row-actions', style: 'margin:0' },
        h('button', { onclick: () => { close(); go('a/' + a.appt_id); } }, 'Sửa chi tiết'),
        h('button', { onclick: () => { close(); go('p/' + a.patient_id); } }, 'Hồ sơ'))));
  document.body.append(wrap);
}

/** Duration chips + free number input (bác sĩ tự ước lượng). */
function durationPicker(value, onChange) {
  const input = h('input', { type: 'number', min: 5, max: 720, step: 5, inputmode: 'numeric', value: value || '', style: 'width:90px',
    oninput: () => { sync(); onChange(input.value); } });
  const chips = DURATIONS.map(m => h('button', { type: 'button', class: 'chip', onclick: () => { input.value = m; sync(); onChange(String(m)); } }, m + "'"));
  const sync = () => chips.forEach((c, i) => c.classList.toggle('active', String(DURATIONS[i]) === String(input.value)));
  sync();
  return { el: h('div', { class: 'chips', style: 'align-items:center;margin:0' }, chips, input, h('span', { class: 'muted' }, 'phút')), input };
}

function patientPicker(initial, onPick) {
  const box = h('div');
  const showSelected = p => box.replaceChildren(h('div', { class: 'picked' },
    h('div', { class: 'row-av' }, avatar(p, 44), h('div', { class: 'row-main' }, h('b', {}, p.full_name), h('span', { class: 'badge' }, p.patient_id),
      phonesOf(p).length ? h('div', { class: 'muted' }, phonesOf(p).join(' · ')) : null)),
    h('button', { type: 'button', onclick: () => { onPick(null); showSearch(); } }, 'Đổi')),
    ...(p.allergies ? [h('div', { class: 'alert' }, '⚠ Dị ứng: ' + p.allergies)] : []));
  const showSearch = () => {
    const q = h('input', { type: 'search', placeholder: 'Gõ tên, mã, SĐT hoặc CCCD…', autocomplete: 'off' });
    const res = h('div', { class: 'list' });
    let t;
    q.addEventListener('input', () => { clearTimeout(t); t = setTimeout(async () => {
      if (!q.value.trim()) return res.replaceChildren();
      try {
        const list = await api('searchPatients', q.value);
        res.replaceChildren(...(list.length ? list.slice(0, 8).map(p => avRow(p, () => { onPick(p); showSelected(p); },
          h('div', {}, h('b', {}, p.full_name), h('span', { class: 'badge' }, p.patient_id)), h('div', { class: 'muted' }, [phonesOf(p)[0], p.national_id ? 'CCCD ' + p.national_id : ''].filter(Boolean).join(' · ')))) : [h('div', { class: 'muted' }, 'Không tìm thấy — tạo bệnh nhân mới trước')]));
      } catch (e) { res.replaceChildren(errBox(e)); }
    }, 250); });
    box.replaceChildren(q, res);
    q.focus();
  };
  if (initial) showSelected(initial); else showSearch();
  return box;
}

async function pageAppointmentForm(id) {
  let a = Object.assign({ appt_date: calState.date, start_time: '', duration_min: '', title: '', notes: '', status: 'scheduled' }, id ? {} : (pendingAppt || {}));
  pendingAppt = null;
  let patient = null;
  if (id || a.patient_id) {
    loading();
    try {
      if (id) { const r = await api('getAppointment', id); a = r.appointment; patient = r.patient; }
      else patient = (await api('getPatient', a.patient_id)).patient;
    } catch (e) { return mount(errBox(e, () => pageAppointmentForm(id))); }
  }
  if (!a.appt_date) a.appt_date = todayStr();
  let patientId = patient ? patient.patient_id : '';
  const picker = patientPicker(patient, p => { patientId = p ? p.patient_id : ''; dirty = true; });
  const date = h('input', { type: 'date', value: a.appt_date, oninput: () => { dirty = true; } });
  const time = h('input', { type: 'time', value: a.start_time || '', step: 300, min: '06:00', max: '21:00', oninput: () => { dirty = true; updEnd(); } });
  const endInfo = h('span', { class: 'muted' });
  let duration = a.duration_min === '' || a.duration_min == null ? '' : String(a.duration_min);
  const dur = durationPicker(duration, v => { duration = v; dirty = true; updEnd(); });
  const updEnd = () => { endInfo.textContent = time.value && duration ? 'Kết thúc ' + minToTime(toMin(time.value) + Number(duration)) : (time.value ? '' : 'Để trống giờ nếu chưa chốt — hẹn hiện ở dòng "Cả ngày"'); };
  updEnd();
  const title = h('input', { value: a.title || '', placeholder: 'VD: Lắp mão sứ R46', oninput: () => { dirty = true; } });
  const notes = h('textarea', { value: a.notes || '', oninput: () => { dirty = true; } });
  const status = h('select', { onchange: () => { dirty = true; } }, Object.entries(APPT_STATUS).map(([k, s]) => h('option', { value: k, selected: k === a.status }, s.icon + ' ' + s.label)));
  const field = (label, el, full) => h('div', { class: full ? 'full' : '' }, h('label', {}, label), el);
  const back = () => { calState.date = date.value || calState.date; go('calendar'); };
  const save = h('button', { class: 'primary', onclick: async () => {
    if (!patientId) return toast('Chưa chọn bệnh nhân', 'warn');
    if (time.value && !duration) return toast('Nhập thời lượng dự kiến', 'warn');
    save.disabled = true;
    try {
      const r = await api('saveAppointment', { appt_id: id || '', patient_id: patientId, appt_date: date.value, start_time: time.value,
        duration_min: time.value ? duration : (duration || ''), title: title.value, notes: notes.value, status: id ? status.value : 'scheduled', visit_id: a.visit_id || '' });
      dirty = false;
      if (r.conflicts.length) toast('Đã lưu · Trùng giờ với: ' + r.conflicts.join(', '), 'warn'); else toast('Đã lưu lịch hẹn');
      back();
    } catch (e) { toast(errMsg(e), 'error'); save.disabled = false; }
  } }, 'Lưu');
  mount(
    h('div', { class: 'row-actions' }, h('button', { onclick: back }, '← Lịch hẹn')),
    h('section', { class: 'card' }, h('h2', {}, id ? 'Sửa lịch hẹn' : 'Lịch hẹn mới'),
      h('div', { class: 'grid-form' },
        field('Bệnh nhân *', picker, true),
        field('Ngày *', date), field('Giờ bắt đầu', time),
        field('Thời lượng dự kiến', h('div', {}, dur.el, endInfo), true),
        field('Nội dung', title, true), field('Ghi chú', notes, true),
        id ? field('Trạng thái', status) : null),
      h('div', { class: 'row-actions', style: 'margin-top:12px' }, save, h('button', { onclick: back }, 'Huỷ'),
        id ? h('button', { class: 'danger', onclick: async () => {
          if (!confirm('Xoá lịch hẹn này?')) return;
          try { await api('deleteAppointment', id); dirty = false; toast('Đã xoá lịch hẹn'); back(); } catch (e) { toast(errMsg(e), 'error'); }
        } }, 'Xoá') : null)));
}
</script>
