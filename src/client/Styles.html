<style>
  :root { --pri:#0b6e6e; --pri-l:#e3f2f1; --bd:#dde3e6; --mut:#6b7780; --red:#c62828; --red-l:#fdecea; --warn:#b26a00; }
  * { box-sizing: border-box; }
  body { margin:0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color:#1d2327; background:#f5f7f8; }
  .topbar { position:sticky; top:0; z-index:5; background:var(--pri); padding:10px 16px; }
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .topbar a { color:#fff; font-weight:600; text-decoration:none; font-size:17px; }
  .topbar nav { display:flex; gap:4px; } .topbar nav a { font-size:13px; font-weight:500; padding:4px 9px; border-radius:14px; background:rgba(255,255,255,.12); }
  .topbar nav a.active { background:#fff; color:var(--pri); }
  @media (max-width: 420px) { .topbar > a { font-size:0; } .topbar > a::before { content:'🦷'; font-size:20px; } }
  main { max-width: 980px; margin: 0 auto; padding: 12px; }
  h2 { margin: 4px 0 6px; font-size: 21px; } h3 { margin: 0 0 8px; font-size: 16px; }
  .card { background:#fff; border:1px solid var(--bd); border-radius:10px; padding:12px; margin-bottom:12px; }
  .muted { color: var(--mut); font-size: 13px; }
  .row-actions { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  button, .btn { font: inherit; border:1px solid var(--bd); background:#fff; border-radius:8px; padding:8px 14px; cursor:pointer; color:inherit; text-decoration:none; display:inline-block; }
  button.primary { background:var(--pri); color:#fff; border-color:var(--pri); }
  button.danger { color:var(--red); border-color:#f1c0bc; }
  button:disabled { opacity:.5; cursor:default; }
  input, select, textarea { font: inherit; width:100%; padding:8px 10px; border:1px solid var(--bd); border-radius:8px; background:#fff; }
  textarea { min-height: 64px; resize: vertical; }
  input.search { font-size:17px; padding:11px 12px; margin-bottom:8px; }
  .list .item { display:block; padding:10px 6px; border-bottom:1px solid #eef1f2; color:inherit; text-decoration:none; }
  .list .item:hover { background:var(--pri-l); }
  .badge { display:inline-block; font-size:12px; padding:1px 7px; border-radius:10px; background:var(--pri-l); color:var(--pri); margin-left:6px; }
  .badge.red { background:var(--red-l); color:var(--red); }
  .alert { background:var(--red-l); color:var(--red); border:1px solid #f5c2bd; border-radius:8px; padding:8px 12px; font-weight:600; margin:8px 0; }
  .date-range { display:flex; flex-wrap:wrap; align-items:center; gap:8px; } .date-range input { width:auto; }
  .grid-form { display:grid; grid-template-columns: 1fr; gap:10px; }
  .grid-form label { display:block; font-size:13px; color:var(--mut); margin-bottom:3px; }
  .grid-form .full { grid-column: 1 / -1; }
  @media (min-width: 720px) { .grid-form { grid-template-columns: 1fr 1fr; } }
  dl.kv { display:grid; grid-template-columns: 130px 1fr; gap:3px 10px; margin:6px 0; } dl.kv dt { color:var(--mut); } dl.kv dd { margin:0; white-space:pre-wrap; }
  .visit-head { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .thumbs { display:grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap:6px; margin-top:8px; }
  .thumb { position:relative; padding:0; aspect-ratio:1; overflow:hidden; background:#eef1f2; border-radius:8px; border:0; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .thumb .lbl { position:absolute; left:4px; bottom:4px; font-size:11px; background:rgba(0,0,0,.55); color:#fff; padding:0 5px; border-radius:6px; }
  .thumb .ph { display:flex; align-items:center; justify-content:center; height:100%; font-size:26px; color:#9aa5ab; }
  .upload-list .up { display:grid; grid-template-columns: 1fr auto; gap:4px 8px; padding:8px 0; border-bottom:1px solid #eef1f2; font-size:14px; }
  .bar { height:6px; background:#eef1f2; border-radius:3px; overflow:hidden; grid-column: 1 / -1; }
  .bar > i { display:block; height:100%; background:var(--pri); width:0; transition: width .2s; }
  .up.error .bar > i { background:var(--red); } .up.done .bar > i { background:#2e7d32; }
  .hidden { display:none; }
  .quota { font-size:13px; color:var(--mut); margin: 8px 2px; } .quota.warn { color:var(--warn); font-weight:600; }
  .quota .bar { margin-top:4px; }
  .loading { padding:30px; text-align:center; color:var(--mut); }
  .err { background:var(--red-l); color:var(--red); padding:10px; border-radius:8px; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#263238; color:#fff; padding:10px 16px; border-radius:8px; opacity:0; pointer-events:none; transition:opacity .2s; max-width:90vw; z-index:50; }
  #toast.show { opacity:1; } #toast.error { background:var(--red); } #toast.warn { background:#b45309; }
  #toast.has-action { pointer-events:auto; display:flex; align-items:center; gap:12px; }
  .toast-act { background:transparent; color:#fff; border:1px solid rgba(255,255,255,.6); padding:4px 10px; font-weight:600; flex:none; }
  .lightbox { position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:40; display:flex; flex-direction:column; color:#fff; }
  .lightbox .lb-top { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px; }
  .lightbox .lb-top select { width:auto; } .lightbox .lb-top .grow { flex:1; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lightbox .lb-img { flex:1; display:flex; align-items:center; justify-content:center; overflow:auto; touch-action: pan-y pinch-zoom; }
  .lightbox img { max-width:100%; max-height:100%; }
  .lightbox .nav { position:absolute; top:50%; transform:translateY(-50%); font-size:30px; background:rgba(255,255,255,.15); color:#fff; border:0; }
  .lightbox .prev { left:8px; } .lightbox .next { right:8px; }
  table.report { width:100%; border-collapse:collapse; font-size:14px; } table.report td, table.report th { border-bottom:1px solid #eef1f2; padding:5px; text-align:left; }
  .tabs { display:flex; gap:6px; position:sticky; top:44px; z-index:4; background:#f5f7f8; padding:6px 0 10px; overflow-x:auto; }
  .tab { flex:1; white-space:nowrap; font-weight:600; }
  .tab.active, .chip.active { background:var(--pri); color:#fff; border-color:var(--pri); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .chip { padding:5px 12px; border-radius:16px; font-size:14px; }
  details.visit > summary { cursor:pointer; list-style:none; }
  details.visit > summary::-webkit-details-marker { display:none; }
  details.visit > summary::after { content:'▾ Xem chi tiết'; display:block; font-size:12px; color:var(--pri); margin-top:4px; }
  details.visit[open] > summary::after { content:'▴ Thu gọn'; }
  .visit-sum .badge { margin-left:6px; }
  .dash-date { color:var(--mut); font-size:13px; margin:0 2px 8px; }
  .stats { display:grid; grid-template-columns: repeat(2, 1fr); gap:8px; margin-bottom:12px; }
  @media (min-width: 720px) { .stats { grid-template-columns: repeat(3, 1fr); } .dash-grid { display:grid; grid-template-columns: 1fr 1fr; gap:12px; align-items:start; } .dash-grid .card { margin:0; } }
  .stat { text-align:left; background:#fff; border:1px solid var(--bd); border-radius:10px; padding:10px 12px; font:inherit; color:inherit; }
  button.stat { cursor:pointer; } button.stat:hover { border-color:var(--pri); }
  .stat-label { font-size:13px; color:var(--mut); } .stat-value { font-size:26px; font-weight:700; line-height:1.2; font-variant-numeric: tabular-nums; }
  .stat-sub { font-size:12px; color:var(--mut); } .stat.warn .stat-value { color:var(--warn); }
  .seg { display:flex; border:1px solid var(--bd); border-radius:8px; overflow:hidden; } .seg button { border:0; border-radius:0; padding:5px 10px; font-size:13px; }
  .seg button.active { background:var(--pri); color:#fff; }
  .chart { position:relative; height:170px; margin:14px 0 4px 44px; }
  .chart .grid { position:absolute; inset:0 0 22px 0; }
  .chart .grid-line { position:absolute; left:0; right:0; border-top:1px solid #e6eaec; }
  .chart .grid-line span { position:absolute; right:100%; margin-right:6px; transform:translateY(-50%); font-size:11px; color:var(--mut); white-space:nowrap; font-variant-numeric: tabular-nums; }
  .chart .cols { position:absolute; inset:0; display:flex; gap:2px; }
  .chart .col { flex:1; display:flex; flex-direction:column; align-items:center; background:none; border:0; padding:0; border-radius:0; }
  .chart .col-plot { position:relative; flex:1; width:100%; display:flex; align-items:flex-end; justify-content:center; padding-bottom:0; margin-bottom:0; }
  .chart .bar-wrap { position:relative; width:min(24px, 60%); min-height:1px; display:flex; }
  .chart .bar-wrap i { display:block; flex:1; border-radius:4px 4px 0 0; }
  .chart .col.sel .col-plot, .chart .col:hover .col-plot { background:rgba(0,137,123,.06); }
  .chart .col-val { position:absolute; bottom:100%; left:50%; transform:translateX(-50%); margin-bottom:2px; font-size:12px; font-weight:600; color:#1d2327; white-space:nowrap; }
  .chart .col-x { height:22px; line-height:22px; font-size:12px; color:var(--mut); }
  .chart-cap { font-size:13px; color:var(--mut); min-height:18px; }
  .tnum { font-variant-numeric: tabular-nums; }
  /* ---- calendar (Lịch hẹn) ---- */
  .cal-toolbar { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px; margin:2px 0 8px; }
  .cal-when { display:flex; align-items:center; gap:12px; }
  .cal-stepper { display:flex; border:1px solid var(--bd); border-radius:10px; overflow:hidden; background:#fff; }
  .cal-stepper button { border:0; border-radius:0; padding:7px 12px; font-size:15px; background:#fff; }
  .cal-stepper button + button { border-left:1px solid var(--bd); }
  .cal-stepper .cal-today { font-weight:600; color:var(--pri); }
  .cal-title { display:flex; flex-direction:column; line-height:1.15; }
  .cal-title b { font-size:20px; letter-spacing:-.2px; color:#12333a; } .cal-title span { font-size:12px; color:var(--mut); }
  .cal-tools { display:flex; gap:8px; align-items:center; }
  .cal-seg { border-radius:10px; background:#fff; } .cal-seg button { padding:7px 12px; font-size:14px; }
  .cal-summary { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; font-size:13px; color:var(--mut); margin:0 2px 10px; }
  .cal-summary b { color:#12333a; font-variant-numeric: tabular-nums; }
  .cal-summary .sum-warn { color:#b71c1c; background:#fdecea; border:1px solid #f5c2bd; padding:2px 9px; border-radius:12px; font-weight:600; }
  .cal-summary .sum-warn b { color:#b71c1c; } .cal-summary .sum-ok { color:#2e7d32; }
  .cal-summary .sum-hint { flex-basis:100%; font-size:12px; }
  @media (min-width: 720px) { .cal-summary .sum-hint { flex-basis:auto; margin-left:auto; } }

  .tg { background:#fff; border:1px solid var(--bd); border-radius:14px; overflow:hidden; box-shadow:0 1px 2px rgba(18,51,58,.06); }
  .tg-head, .tg-allday, .tg-grid { display:flex; }
  .tg-gutter { width:50px; flex:none; font-size:11px; color:var(--mut); }
  .tg-head { border-bottom:1px solid var(--bd); background:#fbfdfd; }
  .tg-day { flex:1; min-width:0; border:0; border-radius:0; background:none; padding:7px 0 6px; display:flex; flex-direction:column; align-items:center; gap:1px; line-height:1.15; }
  .tg-day .wd { font-size:12px; color:var(--mut); }
  .tg-day b { font-size:18px; width:32px; height:32px; line-height:32px; border-radius:50%; color:#12333a; font-variant-numeric: tabular-nums; }
  .tg-day .cnt { font-size:10.5px; color:var(--mut); min-height:14px; white-space:nowrap; }
  .tg-day .cnt.warn { color:#b71c1c; font-weight:700; }
  .tg-day.today .wd { color:var(--pri); font-weight:600; } .tg-day.today b { background:var(--pri); color:#fff; }
  .tg-day.sunday .wd { color:#c62828; }
  .tg-allday { border-bottom:1px solid var(--bd); min-height:30px; }
  .tg-allday > .tg-gutter { padding:8px 4px 0 6px; font-size:10.5px; }
  .tg-allday-col { flex:1; min-width:0; padding:3px; display:flex; flex-direction:column; gap:3px; border-left:1px solid #eef2f2; }
  .tg-scroll { height:min(66vh, 680px); overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  .tg-times { position:relative; }
  .tg-hour { position:relative; box-sizing:border-box; }
  .tg-hour span { position:absolute; top:-7px; right:8px; font-variant-numeric: tabular-nums; }
  .now-pill { position:absolute; right:2px; transform:translateY(-50%); background:#d32f2f; color:#fff; font-size:10.5px; font-weight:700; padding:1px 5px; border-radius:8px; z-index:3; font-variant-numeric: tabular-nums; }
  .tg-col { position:relative; flex:1; min-width:0; border-left:1px solid #eef2f2; cursor:copy;
    background-image: repeating-linear-gradient(to bottom, #e4ebeb 0 1px, transparent 1px 24px, #f2f5f5 24px 25px, transparent 25px 48px); }
  .tg-col.today { background-color:#f3faf9; }
  .tg-col:hover { background-color:#f7fbfb; } .tg-col.today:hover { background-color:#eef8f6; }

  /* appointment block */
  .ev { position:absolute; z-index:2; text-align:left; border:0; border-left:4px solid #0e8a7e; background:#e3f3f1; color:#0d3b37;
    border-radius:8px; padding:3px 6px 4px; font-size:12.5px; line-height:1.25; overflow:hidden; cursor:grab; user-select:none; -webkit-user-select:none;
    box-shadow:0 0 0 1.5px #fff; touch-action:pan-y; transition:box-shadow .15s; }
  .ev:hover { box-shadow:0 0 0 1.5px #fff, 0 3px 10px rgba(18,51,58,.16); }
  .ev:focus-visible { outline:2px solid var(--pri); outline-offset:1px; }
  .ev-top { display:flex; justify-content:space-between; align-items:center; gap:4px; }
  .ev-t { font-weight:700; font-size:11.5px; font-variant-numeric: tabular-nums; opacity:.85; white-space:nowrap; }
  .ev-flag { font-size:11px; font-weight:700; } .ev-flag.ok { color:#2e7d32; }
  .ev-n { display:flex; align-items:center; gap:5px; font-weight:650; margin-top:1px; min-width:0; }
  .ev-n > span:last-child { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ev-n .avatar { font-size:9px !important; }
  .ev-d { color:#3c5a60; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
  .ev-warn { margin-top:3px; font-size:11px; font-weight:700; color:#b71c1c; }
  .ev.compact { padding-top:1px; } .ev.compact .ev-top { display:none; }
  .ev-resize { position:absolute; left:0; right:0; bottom:0; height:9px; cursor:ns-resize; touch-action:none; }
  .ev-resize::after { content:''; position:absolute; left:50%; bottom:3px; width:18px; height:3px; margin-left:-9px; border-radius:2px; background:currentColor; opacity:0; transition:opacity .15s; }
  .ev:hover .ev-resize::after, .ev.dragging .ev-resize::after { opacity:.35; }
  .ev.st-arrived { background:#eef2f4; border-left-color:#7b8e97; color:#3f535b; }
  .ev.has-result { background:#e8f5e9; border-left-color:#2e7d32; color:#1b4d20; }
  .ev.st-no_show { background:#fff3e0; border-left-color:#c77700; color:#6d4100; }
  .ev.st-cancelled { background:repeating-linear-gradient(135deg, #f6f6f6 0 6px, #efefef 6px 12px); border-left-color:#bdbdbd; color:#9e9e9e; cursor:pointer; }
  .ev.st-cancelled .ev-n span { text-decoration:line-through; }
  /* overlapping bookings: the one loud thing on the calendar */
  .ev.conflict { background:repeating-linear-gradient(135deg, #fdecea 0 7px, #fbdcd8 7px 14px); border-left-color:#d32f2f; color:#7f1010;
    box-shadow:0 0 0 1.5px #fff, inset 0 0 0 1.5px #e57373; }
  .ev.conflict .ev-flag { color:#d32f2f; }
  .ev.dragging { z-index:20; cursor:grabbing; opacity:.95; box-shadow:0 10px 24px rgba(18,51,58,.28); transition:none; }
  .drag-label { position:absolute; right:4px; top:3px; background:#12333a; color:#fff; font-size:11px; font-weight:700; padding:1px 6px; border-radius:6px; font-variant-numeric: tabular-nums; white-space:nowrap; }
  .tg.week .ev { font-size:11px; padding:2px 3px; border-left-width:3px; } .tg.week .ev-n { font-weight:600; }
  @media (max-width: 719px) {
    .tg.week .ev { padding:1px 2px; border-radius:5px; } .tg.week .ev-t { font-size:10px; letter-spacing:-.2px; }
    .tg.week .ev-flag, .tg.week .ev-d { display:none; } .tg.week .ev-n { font-size:10px; }
    .mv-ev { font-size:10px; padding:1px 2px; text-align:center; } .mv-name { display:none; }
  }
  .ev.narrow > :not(.ev-resize) { display:none; }
  .chip-ev, .mv-ev, .appt-chip { position:static; display:block; width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  .now-line { z-index:1; position:absolute; left:0; right:0; border-top:2px solid #d32f2f; pointer-events:none; }
  .now-line::before { content:''; position:absolute; left:-5px; top:-6px; width:10px; height:10px; border-radius:50%; background:#d32f2f; }

  /* month */
  .mv { background:#fff; border:1px solid var(--bd); border-radius:14px; overflow:hidden; }
  .mv-head, .mv-grid { display:grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .mv-head div { text-align:center; font-size:12px; color:var(--mut); padding:8px 0; border-bottom:1px solid var(--bd); background:#fbfdfd; }
  .mv-head div:last-child { color:#c62828; }
  .mv-cell { min-height:92px; border-right:1px solid #eef2f2; border-bottom:1px solid #eef2f2; padding:3px; cursor:pointer; display:flex; flex-direction:column; gap:2px; min-width:0; }
  .mv-cell:hover { background:#f7fbfb; }
  .mv-cell.other { background:#fafbfb; } .mv-cell.other .mv-date { color:#b0bec5; }
  .mv-cell.has-conflict { box-shadow: inset 0 3px 0 #d32f2f; }
  .mv-top { display:flex; justify-content:space-between; align-items:center; }
  .mv-date { font-size:12.5px; font-weight:600; width:24px; height:24px; line-height:24px; text-align:center; border-radius:50%; font-variant-numeric: tabular-nums; }
  .mv-cell.today .mv-date { background:var(--pri); color:#fff; }
  .mv-warn { font-size:10.5px; font-weight:700; color:#b71c1c; } .mv-count { font-size:10.5px; color:var(--mut); }
  .mv-ev { font-size:10.5px; padding:1px 4px; border-left-width:3px; border-radius:5px; }
  .mv-more { font-size:10.5px; color:var(--mut); padding-left:3px; }
  @media (min-width: 720px) { .mv-cell { min-height:118px; padding:4px; } .mv-ev { font-size:12px; } }

  /* sheet */
  .sheet-wrap { position:fixed; inset:0; background:rgba(18,51,58,.38); z-index:45; display:flex; align-items:flex-end; justify-content:center; animation:fadeIn .15s; }
  .sheet { background:#fff; width:100%; max-width:560px; border-radius:18px 18px 0 0; padding:8px 16px 20px; max-height:88vh; overflow:auto; animation:sheetUp .2s ease-out; }
  .sheet-grip { width:40px; height:4px; border-radius:2px; background:#d5dde0; margin:0 auto 10px; }
  .sheet-when { display:flex; flex-direction:column; margin:12px 0 6px; } .sheet-when b { font-size:22px; color:#12333a; font-variant-numeric: tabular-nums; } .sheet-when span { color:var(--mut); font-size:13px; }
  .sheet-conflict { border-top:4px solid #d32f2f; }
  .warn-box { background:#fdecea; border-color:#f5c2bd; color:#7f1010; }
  .icon-btn { border-radius:50%; width:36px; height:36px; padding:0; }
  .quick-edit { border:1px solid var(--bd); border-radius:12px; padding:10px; margin:4px 0 10px; background:#fbfdfd; }
  .quick-edit label { display:block; font-size:12px; color:var(--mut); }
  .quick-row { display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:8px; }
  @keyframes sheetUp { from { transform:translateY(30px); opacity:.6; } to { transform:none; opacity:1; } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @media (prefers-reduced-motion: reduce) { .sheet, .sheet-wrap { animation:none; } }
  @media (min-width: 720px) { .sheet-wrap { align-items:center; } .sheet { border-radius:18px; } }
  .picked { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 10px; border:1px solid var(--bd); border-radius:8px; }
  .appt-line { display:flex; flex-direction:column; gap:4px; margin-top:8px; } .appt-chip { padding:5px 8px; font-size:13px; width:auto; }
  .avatar { flex:none; display:inline-flex; align-items:center; justify-content:center; border-radius:50%; color:#fff; font-weight:600; overflow:hidden; letter-spacing:.5px; }
  .avatar img { width:100%; height:100%; object-fit:cover; display:block; }
  .row-av { display:flex; align-items:center; gap:10px; } .row-main { min-width:0; flex:1; }
  .list .item.row-av { display:flex; }
  .p-head { display:flex; gap:12px; align-items:flex-start; } .p-head h2 { margin:0; }
  .av-row { display:flex; align-items:center; gap:14px; margin:4px 0 14px; }
