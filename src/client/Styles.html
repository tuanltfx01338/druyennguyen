<style>
  :root { --pri:#0b6e6e; --pri-l:#e3f2f1; --bd:#dde3e6; --mut:#6b7780; --red:#c62828; --red-l:#fdecea; --warn:#b26a00; }
  * { box-sizing: border-box; }
  body { margin:0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color:#1d2327; background:#f5f7f8; }
  .topbar { position:sticky; top:0; z-index:5; background:var(--pri); padding:10px 16px; }
  .topbar a { color:#fff; font-weight:600; text-decoration:none; font-size:17px; }
  main { max-width: 980px; margin: 0 auto; padding: 12px; }
  h2 { margin: 4px 0 6px; font-size: 21px; } h3 { margin: 0 0 8px; font-size: 16px; }
  .card { background:#fff; border:1px solid var(--bd); border-radius:10px; padding:12px; margin-bottom:12px; }
  .muted { color: var(--mut); font-size: 13px; }
  .row-actions { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  button, .btn { font: inherit; border:1px solid var(--bd); background:#fff; border-radius:8px; padding:8px 14px; cursor:pointer; color:inherit; text-decoration:none; display:inline-block; }
  button.primary { background:var(--pri); color:#fff; border-color:var(--pri); }
  button.danger { color:var(--red); border-color:#f1c0bc; }
  button:disabled { opacity:.5; cursor:default; }
  input, select, textarea { font: inherit; width:100%; padding:8px 10px; border:1px solid var(--bd); border-radius:8px; background:#fff; }
  textarea { min-height: 64px; resize: vertical; }
  input.search { font-size:17px; padding:11px 12px; margin-bottom:8px; }
  .list .item { display:block; padding:10px 6px; border-bottom:1px solid #eef1f2; color:inherit; text-decoration:none; }
  .list .item:hover { background:var(--pri-l); }
  .badge { display:inline-block; font-size:12px; padding:1px 7px; border-radius:10px; background:var(--pri-l); color:var(--pri); margin-left:6px; }
  .badge.red { background:var(--red-l); color:var(--red); }
  .alert { background:var(--red-l); color:var(--red); border:1px solid #f5c2bd; border-radius:8px; padding:8px 12px; font-weight:600; margin:8px 0; }
  .date-range { display:flex; flex-wrap:wrap; align-items:center; gap:8px; } .date-range input { width:auto; }
  .grid-form { display:grid; grid-template-columns: 1fr; gap:10px; }
  .grid-form label { display:block; font-size:13px; color:var(--mut); margin-bottom:3px; }
  .grid-form .full { grid-column: 1 / -1; }
  @media (min-width: 720px) { .grid-form { grid-template-columns: 1fr 1fr; } }
  dl.kv { display:grid; grid-template-columns: 130px 1fr; gap:3px 10px; margin:6px 0; } dl.kv dt { color:var(--mut); } dl.kv dd { margin:0; white-space:pre-wrap; }
  .visit-head { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .thumbs { display:grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap:6px; margin-top:8px; }
  .thumb { position:relative; padding:0; aspect-ratio:1; overflow:hidden; background:#eef1f2; border-radius:8px; border:0; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .thumb .lbl { position:absolute; left:4px; bottom:4px; font-size:11px; background:rgba(0,0,0,.55); color:#fff; padding:0 5px; border-radius:6px; }
  .thumb .ph { display:flex; align-items:center; justify-content:center; height:100%; font-size:26px; color:#9aa5ab; }
  .upload-list .up { display:grid; grid-template-columns: 1fr auto; gap:4px 8px; padding:8px 0; border-bottom:1px solid #eef1f2; font-size:14px; }
  .bar { height:6px; background:#eef1f2; border-radius:3px; overflow:hidden; grid-column: 1 / -1; }
  .bar > i { display:block; height:100%; background:var(--pri); width:0; transition: width .2s; }
  .up.error .bar > i { background:var(--red); } .up.done .bar > i { background:#2e7d32; }
  .hidden { display:none; }
  .quota { font-size:13px; color:var(--mut); margin: 8px 2px; } .quota.warn { color:var(--warn); font-weight:600; }
  .quota .bar { margin-top:4px; }
  .loading { padding:30px; text-align:center; color:var(--mut); }
  .err { background:var(--red-l); color:var(--red); padding:10px; border-radius:8px; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#263238; color:#fff; padding:10px 16px; border-radius:8px; opacity:0; pointer-events:none; transition:opacity .2s; max-width:90vw; z-index:50; }
  #toast.show { opacity:1; } #toast.error { background:var(--red); } #toast.warn { background:var(--warn); }
  .lightbox { position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:40; display:flex; flex-direction:column; color:#fff; }
  .lightbox .lb-top { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px; }
  .lightbox .lb-top select { width:auto; } .lightbox .lb-top .grow { flex:1; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lightbox .lb-img { flex:1; display:flex; align-items:center; justify-content:center; overflow:auto; touch-action: pan-y pinch-zoom; }
  .lightbox img { max-width:100%; max-height:100%; }
  .lightbox .nav { position:absolute; top:50%; transform:translateY(-50%); font-size:30px; background:rgba(255,255,255,.15); color:#fff; border:0; }
  .lightbox .prev { left:8px; } .lightbox .next { right:8px; }
  table.report { width:100%; border-collapse:collapse; font-size:14px; } table.report td, table.report th { border-bottom:1px solid #eef1f2; padding:5px; text-align:left; }
  .tabs { display:flex; gap:6px; position:sticky; top:44px; z-index:4; background:#f5f7f8; padding:6px 0 10px; overflow-x:auto; }
  .tab { flex:1; white-space:nowrap; font-weight:600; }
  .tab.active, .chip.active { background:var(--pri); color:#fff; border-color:var(--pri); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .chip { padding:5px 12px; border-radius:16px; font-size:14px; }
  details.visit > summary { cursor:pointer; list-style:none; }
  details.visit > summary::-webkit-details-marker { display:none; }
  details.visit > summary::after { content:'▾ Xem chi tiết'; display:block; font-size:12px; color:var(--pri); margin-top:4px; }
  details.visit[open] > summary::after { content:'▴ Thu gọn'; }
  .visit-sum .badge { margin-left:6px; }
</style>
