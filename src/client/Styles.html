<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Sổ bệnh án — "xanh ngọc nha khoa": teal for navigation/info, coral for the main action;
     red/amber stay reserved for allergies, systemic disease, conflicts and deletes. */
  :root {
    --ink:#0B2E33; --ink-2:#2D4A4F; --mut:#5B7175; --mut-2:#8CA0A3;
    --bg:#F4FBFA; --surface:#FFFFFF; --line:#DCEBE8; --line-2:#EAF4F2;
    --brand:#0E8C85; --brand-d:#0A6E69; --brand-l:#E1F4F1; --brand-xl:#F0FAF8; --brand-deep:#0B3B3C;
    --accent:#FF7A59; --accent-d:#E9603F; --accent-l:#FFEDE6;
    --violet:#7C5CFC; --violet-l:#EFEBFF;
    --sky:#2F80ED; --sky-l:#E7F0FD;
    /* legacy names used across the stylesheet */
    --blue:var(--brand); --blue-d:var(--brand-d); --blue-l:var(--brand-l);
    --mint:#16A34A; --mint-d:#15803D; --mint-l:#E3F7EA;
    --amber:#A35F00; --amber-bg:#FFF3DC; --amber-line:#F4C46A;
    --red:#D92D20; --red-d:#A8190F; --red-l:#FDECEA; --red-line:#F5B5AE;
    --r:18px; --r-sm:12px;
    --shadow:0 1px 2px rgba(11,59,60,.05), 0 6px 18px rgba(14,140,133,.08);
    --nav-h:66px; --safe-b:env(safe-area-inset-bottom, 0px);
    --font:'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; font:15px/1.5 var(--font); color:var(--ink); background:var(--bg); padding-bottom:calc(var(--nav-h) + var(--safe-b) + 8px); }
  .tnum, .hero-clock, .stat-value, .tl-time b, .visit-date b { font-variant-numeric: tabular-nums; }
  h1, h2, h3 { margin:0; letter-spacing:-.01em; }
  a { color:var(--blue); }
  .ic { display:inline-flex; flex:none; } .ic svg { display:block; }
  .hidden { display:none !important; }
  :focus-visible { outline:3px solid rgba(14,140,133,.45); outline-offset:2px; }

  /* ---- app frame: bottom tab bar on phones, left rail on desktop ---- */
  .nav { position:fixed; z-index:30; left:0; right:0; bottom:0; height:calc(var(--nav-h) + var(--safe-b)); padding-bottom:var(--safe-b);
    display:grid; grid-template-columns:repeat(4, 1fr); background:var(--surface); border-top:1px solid var(--line); }
  .nav a, .nav button { all:unset; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    font:500 11.5px/1.2 var(--font); color:var(--mut); }
  .nav a.active { color:var(--blue); } .nav a.active .ic { background:var(--blue-l); border-radius:12px; }
  .nav .ic { padding:3px 14px; }
  .nav .nav-add .ic { background:var(--ink); color:#fff; border-radius:12px; }
  .nav .brand { display:none; }
  main { max-width:1100px; margin:0 auto; padding:14px 14px 24px; }
  @media (min-width: 960px) {
    body { padding-bottom:0; }
    .nav { top:0; right:auto; width:228px; height:auto; display:flex; flex-direction:column; gap:4px; padding:18px 14px; border-top:0; border-right:1px solid var(--line); background:var(--ink); }
    .nav a, .nav button { flex-direction:row; justify-content:flex-start; gap:12px; padding:10px 12px; border-radius:12px; font-size:15px; color:#C7D0E2; }
    .nav .ic { padding:0; } .nav a.active { background:rgba(255,255,255,.1); color:#fff; } .nav a.active .ic { background:none; }
    .nav a:hover, .nav button:hover { background:rgba(255,255,255,.06); color:#fff; }
    .nav .nav-add { margin-top:10px; background:var(--blue); color:#fff; } .nav .nav-add .ic { background:none; }
    .nav .nav-add:hover { background:var(--blue-d); }
    .nav .brand { display:flex; color:#fff; font-weight:700; font-size:17px; margin:0 0 18px; padding:6px 12px; }
    main { margin-left:228px; padding:26px 32px 40px; }
  }

  /* ---- page header ---- */
  .ph { display:flex; align-items:center; gap:10px; margin:4px 0 14px; min-height:44px; }
  .ph-text { flex:1; min-width:0; }
  .ph h1 { font-size:26px; font-weight:800; line-height:1.15; }
  .ph-sub { color:var(--mut); font-size:14px; margin-top:2px; }
  .ph-actions { display:flex; gap:8px; }
  .ph-back { margin-left:-6px; }

  /* ---- surfaces ---- */
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; margin-bottom:14px; }
  .sec-title { font-size:16px; font-weight:700; margin-bottom:8px; }
  .sec-head { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; }
  .sec-head .sec-title { margin:0; }
  .visit-head { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .badge { display:inline-block; font-size:12px; font-weight:600; color:var(--mut); background:var(--line-2); padding:1px 8px; border-radius:8px; margin-left:6px; vertical-align:1px; }
  .badge.red { color:var(--red-d); background:var(--red-l); }
  .muted, .row-sub { color:var(--mut); font-size:13.5px; }
  .pad { padding:10px 4px; }
  .empty { color:var(--mut); padding:14px 4px; font-size:14px; }
  .loading { padding:40px 0; text-align:center; color:var(--mut); }
  .err { background:var(--red-l); color:var(--red-d); padding:12px; border-radius:var(--r-sm); display:flex; gap:10px; align-items:center; justify-content:space-between; }
  .facts { display:flex; flex-wrap:wrap; gap:2px 12px; color:var(--mut); font-size:13.5px; }
  .facts span { white-space:nowrap; }
  .info { display:flex; gap:8px; align-items:flex-start; background:var(--blue-l); color:#0A5752; border-radius:var(--r-sm); padding:10px 12px; margin:0 0 14px; font-size:14px; }

  /* ---- buttons & inputs ---- */
  button, .btn { font:600 14.5px/1.2 var(--font); display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:42px; padding:9px 15px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:12px; cursor:pointer; text-decoration:none; }
  button:hover, .btn:hover { border-color:#B9D6D1; background:var(--brand-xl); }
  button.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
  button.primary:hover { background:var(--blue-d); border-color:var(--blue-d); }
  button.danger { color:var(--red); border-color:var(--red-line); background:#fff; }
  button.small, .btn.small { min-height:34px; padding:6px 11px; font-size:13px; border-radius:10px; gap:5px; }
  button.ok { color:var(--mint-d); border-color:#BFE6D3; background:var(--mint-l); }
  button:disabled { opacity:.5; cursor:default; }
  .icon-btn { width:42px; min-height:42px; height:42px; padding:0; border-radius:50%; flex:none; }
  .link-btn { border:0; background:none; color:var(--blue); padding:6px 0; min-height:0; font-weight:600; }
  .row-actions { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  input, select, textarea { font:400 16px/1.4 var(--font); color:var(--ink); width:100%; min-height:44px; padding:10px 12px; border:1px solid var(--line); border-radius:var(--r-sm); background:#fff; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(14,140,133,.18); }
  textarea { min-height:76px; resize:vertical; }
  .search-bar { position:relative; margin-bottom:14px; }
  .search-bar .ic { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--mut-2); pointer-events:none; }
  .search-bar input.search { padding-left:44px; min-height:50px; border-radius:14px; font-size:16px; background:var(--surface); }
  .grid-form { display:grid; grid-template-columns:1fr; gap:12px; }
  .grid-form label { display:block; font-size:13px; font-weight:600; color:var(--ink-2); margin-bottom:4px; }
  .grid-form .full { grid-column:1 / -1; }
  @media (min-width: 720px) { .grid-form { grid-template-columns:1fr 1fr; } }
  .date-range { display:flex; flex-wrap:wrap; align-items:flex-end; gap:10px; margin-bottom:6px; }
  .date-range label { font-size:13px; color:var(--mut); display:flex; flex-direction:column; gap:3px; }
  .date-range input { width:auto; }
  /* sticky save bar (above the phone tab bar) */
  .action-bar { position:sticky; bottom:calc(var(--nav-h) + var(--safe-b)); z-index:20; display:flex; gap:8px; padding:10px 0;
    margin:0 -14px; padding-left:14px; padding-right:14px; background:linear-gradient(to top, var(--bg) 70%, rgba(244,251,250,0)); }
  .action-bar .primary { flex:1; min-height:50px; font-size:16px; }
  @media (min-width: 960px) { .action-bar { bottom:0; margin:0; padding-left:0; padding-right:0; } .action-bar .primary { flex:0 0 220px; } }

  /* ---- lists ---- */
  .list .item { display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--line-2); color:inherit; text-decoration:none; cursor:pointer; }
  .list .item:last-child { border-bottom:0; }
  .list .item:hover { background:var(--brand-xl); }
  .list-cap { font-size:12.5px; color:var(--mut); padding:2px 4px 6px; }
  .row-av { display:flex; align-items:center; gap:12px; } .row-main { min-width:0; flex:1; }
  .row-title { display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
  .row-title b { font-weight:600; }
  .list .item > .ic-next { color:var(--mut-2); }
  .dot-alert { display:inline-flex; align-items:center; gap:3px; font-size:12px; font-weight:700; color:var(--red); }
  .when-tag { font-size:12.5px; font-weight:700; color:var(--blue); background:var(--blue-l); padding:1px 7px; border-radius:8px; font-variant-numeric: tabular-nums; }
  .count-tag { display:inline-flex; align-items:center; gap:3px; font-size:12px; color:var(--mut); background:var(--line-2); padding:1px 7px; border-radius:8px; }
  .icon-btn.call { color:var(--mint-d); border-color:#BFE6D3; background:var(--mint-l); width:38px; height:38px; min-height:38px; }
  .avatar { flex:none; display:inline-flex; align-items:center; justify-content:center; border-radius:50%; color:#fff; font-weight:700; overflow:hidden; }
  .avatar img { width:100%; height:100%; object-fit:cover; display:block; }

  /* ---- Hôm nay ---- */
  .dash { display:block; }
  @media (min-width: 1100px) { .dash { display:grid; grid-template-columns:minmax(0, 1.55fr) minmax(0, 1fr); gap:18px; align-items:start; } }
  /* the one loud element: who is next */
  .hero { background:var(--ink); color:#fff; border-radius:20px; padding:18px; margin-bottom:14px; display:flex; flex-direction:column; gap:12px; }
  .hero-time { display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px; }
  .hero-kicker { flex-basis:100%; color:#9FE3DA; font-size:13px; font-weight:600; }
  .hero-clock { font-size:44px; font-weight:800; line-height:1; letter-spacing:-.02em; }
  .hero-when { color:#C7D0E2; font-size:14px; }
  .hero.late .hero-clock { color:#FFC46B; }
  .hero-who { display:flex; align-items:center; gap:12px; }
  .hero-name { font-size:21px; font-weight:700; line-height:1.25; }
  .hero .facts { color:#AEB9CF; }
  .hero-line { display:flex; flex-direction:column; gap:1px; border-top:1px solid rgba(255,255,255,.12); padding-top:10px; font-size:14.5px; }
  .hero-line > span:first-child { color:#9AA7C0; font-size:12.5px; }
  .hero-plan { color:#C7D0E2; font-size:13.5px; }
  .hero .meds .med { background:#FFE7E4; color:#8A1209; border:0; }
  .hero .meds .med-sys { background:#FFF0D2; color:#7A4600; }
  .hero-actions { display:flex; gap:8px; }
  .hero-actions .cta { flex:1; min-height:52px; font-size:16.5px; background:var(--blue); border-color:var(--blue); color:#fff; border-radius:14px; }
  .hero-actions .cta:hover { background:#FF8E72; }
  .hero-actions .ghost { min-height:52px; background:transparent; color:#fff; border-color:rgba(255,255,255,.3); border-radius:14px; }
  .hero-actions .ghost:hover { background:rgba(255,255,255,.08); }
  .hero-actions .icon-only { width:52px; padding:0; }
  .hero-done { flex-direction:row; align-items:center; gap:14px; background:var(--mint-d); }
  .progress { height:6px; background:var(--line-2); border-radius:3px; overflow:hidden; margin:0 0 6px; }
  .progress > i { display:block; height:100%; background:var(--mint); border-radius:3px; }
  .tl-row { display:grid !important; grid-template-columns:50px auto minmax(0, 1fr) auto; }
  .tl-row > button { white-space:nowrap; }
  @media (max-width: 480px) { .tl-row { grid-template-columns:48px minmax(0, 1fr) auto; gap:10px; } .tl-row > .avatar { display:none; } }
  .counter { font-size:13px; font-weight:600; color:var(--mint-d); background:var(--mint-l); padding:2px 8px; border-radius:10px; margin-left:8px; white-space:nowrap; vertical-align:2px; }
  .sec-head > button { white-space:nowrap; }
  .tl-time { display:flex; flex-direction:column; line-height:1.15; } .tl-time b { font-size:15.5px; } .tl-time span { font-size:11.5px; color:var(--mut); }
  .tl-row.done .row-title b, .tl-row.done .tl-time b { color:var(--mut); }
  .tl-row.missed .row-title b, .tl-row.cancelled .row-title b { text-decoration:line-through; color:var(--mut-2); }
  .state-tag { font-size:12.5px; color:var(--mut); }
  /* numbers are secondary here: one compact strip */
  .stats { display:grid; grid-template-columns:repeat(4, 1fr); background:var(--surface); border:1px solid var(--line); border-radius:var(--r); margin-bottom:14px; overflow:hidden; }
  .stat { all:unset; box-sizing:border-box; padding:10px 10px 11px; display:flex; flex-direction:column; min-width:0; }
  .stat + .stat { border-left:1px solid var(--line-2); }
  button.stat { cursor:pointer; } button.stat:hover { background:var(--brand-xl); }
  .stat-value { font-size:22px; font-weight:800; line-height:1.15; }
  .stat-label { font-size:12px; font-weight:600; color:var(--ink-2); line-height:1.25; }
  .stat-sub { font-size:11px; color:var(--mut); line-height:1.25; margin-top:2px; }
  @media (min-width: 720px) { .stat { padding:12px 16px; } .stat-value { font-size:26px; } .stat-label { font-size:13px; } .stat-sub { font-size:12px; } }
  .quota { font-size:12.5px; color:var(--mut); margin:6px 2px 0; } .quota.warn { color:var(--amber); font-weight:600; } .quota .progress { margin-top:5px; }
  .quota .progress > i { background:var(--blue); }
  .refresh-link { font-size:12.5px; min-height:32px; padding:4px 2px; margin-top:2px; }
  /* chart */
  .chart { position:relative; height:160px; margin:14px 0 4px 34px; }
  .chart .grid { position:absolute; inset:0 0 22px 0; }
  .chart .grid-line { position:absolute; left:0; right:0; border-top:1px solid var(--line-2); }
  .chart .grid-line span { position:absolute; right:100%; margin-right:6px; transform:translateY(-50%); font-size:11px; color:var(--mut); font-variant-numeric: tabular-nums; }
  .chart .cols { position:absolute; inset:0; display:flex; gap:2px; }
  .chart .col { all:unset; flex:1; display:flex; flex-direction:column; align-items:center; cursor:pointer; }
  .chart .col-plot { position:relative; flex:1; width:100%; display:flex; align-items:flex-end; justify-content:center; border-radius:6px; }
  .chart .bar-wrap { position:relative; width:min(26px, 60%); min-height:1px; display:flex; }
  .chart .bar-wrap i { display:block; flex:1; border-radius:5px 5px 0 0; }
  .chart .col.sel .col-plot, .chart .col:hover .col-plot { background:var(--blue-l); }
  .chart .col-val { position:absolute; bottom:100%; left:50%; transform:translateX(-50%); margin-bottom:2px; font-size:12px; font-weight:700; white-space:nowrap; }
  .chart .col-x { height:22px; line-height:22px; font-size:12px; color:var(--mut); }
  .chart-cap { font-size:13px; color:var(--mut); min-height:18px; }

  /* ---- patient ---- */
  .p-card { background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:16px; margin-bottom:12px; display:flex; flex-direction:column; gap:12px; }
  .p-card.compact { padding:12px 14px; border-radius:var(--r); gap:10px; }
  .p-head { display:flex; gap:14px; align-items:center; }
  .p-name { font-size:23px; font-weight:800; line-height:1.2; } .p-name.sm { font-size:17px; font-weight:700; }
  .p-head .facts + .facts { margin-top:2px; }
  .meds { display:flex; flex-direction:column; gap:6px; }
  .med { display:flex; gap:8px; align-items:flex-start; border-radius:12px; padding:8px 12px; font-size:14px; line-height:1.4; }
  .med .ic { margin-top:1px; }
  .med-allergy { background:var(--red-l); color:var(--red-d); border:1px solid var(--red-line); }
  .med-sys { background:var(--amber-bg); color:var(--amber); border:1px solid var(--amber-line); }
  .med-meds { background:var(--blue-l); color:#0A5752; }
  .med-pending { background:var(--blue-l); color:#0A5752; border:1px dashed #7CCBC3; align-items:center; }
  .med-pending > span { flex:1; }
  .med-pending .link-btn { flex:none; font-weight:700; }
  .hero .meds .med-pending { background:#DDF3EF; color:#0A5752; }
  .badge.amber { color:var(--amber); background:var(--amber-bg); }
  .new-pt { display:grid; gap:10px; margin-top:8px; padding:12px; border:1px dashed #7CCBC3; border-radius:12px; background:var(--blue-l); }
  .new-pt .hint { font-size:13px; color:var(--mut); }
  .med.big { font-size:15px; padding:10px 14px; }
  .p-actions { display:grid; grid-template-columns:minmax(0, 1.5fr) minmax(0, 1fr) auto; gap:8px; }
  .p-actions > * { white-space:nowrap; padding-left:12px; padding-right:12px; }
  .p-actions .primary { min-height:48px; }
  .appt-line { display:flex; flex-direction:column; gap:6px; }
  .appt-chip { justify-content:flex-start; min-height:38px; gap:8px; font-weight:500; background:var(--blue-l); border-color:transparent; color:#0A5752; }
  .appt-chip b { font-variant-numeric: tabular-nums; } .appt-chip span { color:#3D6B67; font-size:13px; }
  .appt-chip.st-arrived { background:var(--line-2); color:var(--mut); }
  .tabs { display:flex; gap:4px; background:#E2EFEC; padding:4px; border-radius:14px; margin:4px 0 12px; overflow-x:auto; }
  .tab { flex:1; min-height:38px; border:0; background:transparent; border-radius:11px; white-space:nowrap; font-size:13.5px; color:var(--ink-2); }
  .tab:hover { background:rgba(255,255,255,.5); }
  .tab.active { background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(11,46,51,.12); }
  details.visit { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; margin-bottom:10px; }
  details.visit > summary { cursor:pointer; list-style:none; display:flex; gap:14px; align-items:center; }
  details.visit > summary::-webkit-details-marker { display:none; }
  details.visit[open] > summary { margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid var(--line-2); }
  .visit-date { flex:none; width:50px; text-align:center; display:flex; flex-direction:column; line-height:1.1; }
  .visit-date b { font-size:17px; } .visit-date span { font-size:11.5px; color:var(--mut); }
  .visit-sum { min-width:0; flex:1; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .chip { min-height:34px; padding:5px 13px; border-radius:17px; font-size:13.5px; font-weight:500; }
  .chip.active, .seg button.active { background:var(--ink); color:#fff; border-color:var(--ink); }
  dl.kv { display:grid; grid-template-columns:120px 1fr; gap:6px 12px; margin:4px 0 10px; font-size:14.5px; }
  dl.kv dt { color:var(--mut); } dl.kv dd { margin:0; white-space:pre-wrap; }
  .av-row { display:flex; align-items:center; gap:16px; margin:2px 0 16px; }
  .phones { display:flex; flex-direction:column; gap:6px; } .phone-row { display:flex; gap:6px; } .phone-row button { flex:none; width:44px; padding:0; }
  .picked { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 12px; border:1px solid var(--line); border-radius:var(--r-sm); margin-bottom:6px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--surface); }
  .seg button { border:0; border-radius:0; min-height:38px; padding:6px 13px; font-size:14px; }

  /* ---- photos ---- */
  .camera-btn { width:100%; min-height:56px; border:2px dashed #9AD3CC; background:var(--brand-xl); color:var(--blue); font-size:16px; border-radius:14px; }
  .camera-btn:hover { background:var(--blue-l); border-color:var(--blue); }
  .thumbs { display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:6px; margin-top:8px; }
  .thumb { all:unset; position:relative; aspect-ratio:1; overflow:hidden; background:var(--line-2); border-radius:10px; cursor:pointer; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .thumb .lbl { position:absolute; left:5px; bottom:5px; font-size:11px; background:rgba(11,46,51,.7); color:#fff; padding:1px 6px; border-radius:6px; }
