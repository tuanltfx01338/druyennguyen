<!DOCTYPE html>
<html lang="vi">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="theme-color" content="#0F1E3D">
  <?!= include('client/Styles'); ?>

<body>
  <script>
    // Runs before the app scripts: if they fail to load, show the error instead of a dead page,
    // and stop href="#" links from navigating the whole window (base target is _top).
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href="#"]');
      if (a) e.preventDefault();
    }, true);
    window.addEventListener('error', function (e) {
      var box = document.getElementById('boot-error');
      if (!box) {
        box = document.createElement('div');
        box.id = 'boot-error';
        box.setAttribute('role', 'alert');
        box.style.cssText = 'position:fixed;left:12px;right:12px;top:12px;z-index:9999;padding:12px 14px;border-radius:10px;background:#FEF3F2;color:#B42318;border:1px solid #FDA29B;font:14px/1.4 system-ui,sans-serif;white-space:pre-wrap';
        box.textContent = 'App gặp lỗi khi tải. Chụp màn hình này gửi người cài đặt:\n';
        document.body.appendChild(box);
      }
      box.textContent += '\n' + (e.message || 'Lỗi không rõ') + (e.lineno ? ' (dòng ' + e.lineno + ':' + e.colno + ')' : '');
    });
  </script>
  <nav class="nav" aria-label="Điều hướng">
    <a href="#" class="brand" data-path="" data-icon="tooth">Sổ bệnh án</a>
    <a href="#" data-path="" data-icon="today">Hôm nay</a>
    <a href="#" data-path="calendar" data-icon="calendar">Lịch hẹn</a>
    <a href="#" data-path="patients" data-icon="users">Bệnh nhân</a>
    <button type="button" id="nav-add" class="nav-add" data-icon="plus">Thêm</button>
  </nav>
  <main id="app"></main>
  <div id="toast" role="status"></div>

</body>
</html>
