<script>
'use strict';
/* ---------- core helpers ---------- */
const api = (fn, ...args) => new Promise((resolve, reject) =>
  google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args));

/** DOM builder — strings become text nodes (never innerHTML) → no XSS from patient data. */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
const $app = document.getElementById('app');
const mount = (...nodes) => $app.replaceChildren(...nodes);
const loading = () => mount(h('div', { class: 'loading' }, 'Đang tải…'));

const LABELS = { truoc: 'Trước', sau: 'Sau', xquang: 'X-quang', khac: 'Khác' };
const labelOptions = sel => Object.entries(LABELS).map(([k, v]) => h('option', { value: k, selected: k === sel }, v));
const pad = n => String(n).padStart(2, '0');
const todayStr = (offset = 0) => { const d = new Date(Date.now() + offset * 864e5); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const fmtDate = s => s ? String(s).split('-').reverse().join('/') : '';
const fmtSize = b => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.round(b / 1024) + ' KB';
const errMsg = e => (e && e.message) || String(e);

let toastTimer;
function toast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show ' + type;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = '', type === 'error' ? 6000 : 3000);
}
function errBox(e, retry) {
  return h('div', { class: 'err' }, errMsg(e), ' ', retry ? h('button', { onclick: retry }, 'Thử lại') : null);
}
function link(path, ...kids) {
  return h('a', { href: '#', class: 'item', onclick: e => { e.preventDefault(); go(path); } }, ...kids);
}
function blobToDataUrl(blob) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
}
function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(blob);
  });
}

/* ---------- avatar (portrait) ---------- */
const AV_COLORS = ['#00897b', '#5c6bc0', '#8d6e63', '#00838f', '#7cb342', '#f4511e', '#6d4c41', '#3949ab'];
const initialsOf = n => { const w = String(n || '?').trim().split(/\s+/); return ((w.length > 1 ? w[w.length - 2][0] : '') + w[w.length - 1][0]).toUpperCase(); };
const avatarQueue = new Map(); // avatar_id → [elements waiting for the image]
let avatarTimer;
/** Round portrait; initials on a colored disc until (or if no) photo. */
function avatar(p, size = 40) {
  const hash = [...String(p.patient_id || p.full_name || '')].reduce((a, c) => a + c.charCodeAt(0), 0);
  const el = h('span', { class: 'avatar', style: `width:${size}px;height:${size}px;font-size:${Math.round(size * 0.38)}px;background:${AV_COLORS[hash % AV_COLORS.length]}` },
    initialsOf(p.full_name));
  if (p.avatar_id) {
    if (thumbCache.has(p.avatar_id)) setAvatarImg(el, thumbCache.get(p.avatar_id));
    else { (avatarQueue.get(p.avatar_id) || avatarQueue.set(p.avatar_id, []).get(p.avatar_id)).push(el); clearTimeout(avatarTimer); avatarTimer = setTimeout(flushAvatars, 30); }
  }
  return el;
}
const setAvatarImg = (el, src) => el.replaceChildren(h('img', { src, alt: '' }));
async function flushAvatars() {
  const ids = [...avatarQueue.keys()];
  for (let i = 0; i < ids.length; i += 30) {
    const batch = ids.slice(i, i + 30);
    let res = {};
    try { res = await api('getThumbs', batch); } catch (e) { /* keep initials */ }
    batch.forEach(id => {
      const els = avatarQueue.get(id) || [];
      avatarQueue.delete(id);
      if (!res[id]) return;
      thumbCache.set(id, res[id]);
      els.forEach(el => setAvatarImg(el, res[id]));
    });
  }
}
const phonesOf = p => String(p.phone || '').split(',').map(x => x.trim()).filter(Boolean);

/* ---------- router (google.script.history keeps browser Back working inside the iframe) ---------- */
let dirty = false;
let uploadBusy = false;
const routes = [
  [/^$/, () => pageDashboard()],
  [/^patients$/, () => pagePatients()],
  [/^p\/new$/, () => pagePatientForm()],
  [/^p\/([^/]+)\/edit$/, m => pagePatientForm(m[1])],
  [/^p\/([^/]+)\/v\/new$/, m => pageVisitForm({ patientId: m[1] })],
  [/^p\/([^/]+)$/, m => pagePatient(m[1])],
  [/^v\/([^/]+)$/, m => pageVisitForm({ visitId: m[1] })],
  [/^import$/, () => pageImport()],
  [/^calendar$/, () => pageCalendar()],
  [/^a\/new$/, () => pageAppointmentForm()],
  [/^a\/([^/]+)$/, m => pageAppointmentForm(m[1])],
];
function canLeave() {
  if (uploadBusy) return confirm('Ảnh đang tải lên. Rời trang sẽ dừng tải. Vẫn rời?');
  if (dirty) return confirm('Có thay đổi chưa lưu. Rời trang?');
  return true;
}
function go(path, push = true) {
  if (!canLeave()) return;
  dirty = false; uploadBusy = false;
  if (push) google.script.history.push({ path }, null, path);
  render(path);
}
let curPath = '';
const currentPath = () => curPath;
function render(path) {
  curPath = path;
  window.scrollTo(0, 0);
  document.querySelectorAll('.topbar nav a').forEach(a => a.classList.toggle('active', a.dataset.path === (path.split('/')[0] === 'a' ? 'calendar' : path === '' ? '' : path.startsWith('p/') ? 'patients' : path)));
  for (const [re, fn] of routes) { const m = path.match(re); if (m) return fn(m); }
  pageDashboard();
}
function start() {
  document.getElementById('home-link').addEventListener('click', e => { e.preventDefault(); go(''); });
  document.querySelectorAll('.topbar nav a').forEach(a => a.addEventListener('click', e => { e.preventDefault(); go(a.dataset.path); }));
  google.script.history.setChangeHandler(e => { dirty = false; uploadBusy = false; render((e.state && e.state.path) || ''); });
  window.addEventListener('beforeunload', e => { if (dirty || uploadBusy) { e.preventDefault(); e.returnValue = ''; } });
  google.script.url.getLocation(loc => render(loc.hash || ''));
}

/* ---------- home ---------- */
function patientRow(p) {
  return h('a', { href: '#', class: 'item row-av', onclick: e => { e.preventDefault(); go('p/' + p.patient_id); } },
    avatar(p, 44),
    h('div', { class: 'row-main' },
      h('div', {}, h('b', {}, p.full_name), h('span', { class: 'badge' }, p.patient_id),
        p.allergies ? h('span', { class: 'badge red' }, 'Dị ứng') : null),
      h('div', { class: 'muted' }, [p.birth_year ? 'Sinh ' + p.birth_year : '', phonesOf(p).join(' · '), p.national_id ? 'CCCD ' + p.national_id : ''].filter(Boolean).join(' · '))));
}
/** List row with a small avatar for dashboard/calendar lists. */
function avRow(p, onclick, ...main) {
  return h('a', { href: '#', class: 'item row-av', onclick: e => { e.preventDefault(); onclick(); } }, avatar(p, 36), h('div', { class: 'row-main' }, ...main));
}

/* ---------- patients list (search) ---------- */
let pendingQuery = '';
function pagePatients() {
  const q = h('input', { type: 'search', class: 'search', placeholder: 'Tìm tên (không dấu cũng được), mã BN, SĐT hoặc CCCD…', autocomplete: 'off', value: pendingQuery });
  pendingQuery = '';
  const results = h('div', { class: 'list' });
  const from = h('input', { type: 'date', value: todayStr(-30) });
  const to = h('input', { type: 'date', value: todayStr() });
  const visitsBox = h('div', { class: 'list' });

  let timer, seq = 0;
  async function doSearch() {
    const my = ++seq;
    results.replaceChildren(h('div', { class: 'muted' }, 'Đang tìm…'));
    try {
      const list = await api('searchPatients', q.value);
      if (my !== seq) return;
      results.replaceChildren(
        h('div', { class: 'muted' }, q.value ? `${list.length} kết quả` : 'Cập nhật gần đây'),
        ...(list.length ? list.map(patientRow)
          : [h('div', { class: 'muted' }, q.value ? 'Không tìm thấy bệnh nhân' : 'Chưa có bệnh nhân nào')]));
    } catch (e) { results.replaceChildren(errBox(e, doSearch)); }
  }
  async function searchDates() {
    if (!from.value || !to.value || from.value > to.value) return toast('Khoảng ngày không hợp lệ', 'warn');
    visitsBox.replaceChildren(h('div', { class: 'muted' }, 'Đang lọc…'));
    try {
      const list = await api('searchVisitsByDate', from.value, to.value);
      visitsBox.replaceChildren(h('div', { class: 'muted' }, list.length + ' lần khám'),
        ...list.map(v => avRow(v, () => go('p/' + v.patient_id), h('div', {}, h('b', {}, fmtDate(v.visit_date)), ' · ', v.full_name,
          h('span', { class: 'badge' }, v.patient_id)), h('div', { class: 'muted' }, v.diagnosis || v.treatment || ''))));
    } catch (e) { visitsBox.replaceChildren(errBox(e, searchDates)); }
  }
  q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(doSearch, 300); });

  mount(
    h('div', { class: 'row-actions' },
      h('button', { class: 'primary', onclick: () => go('p/new') }, '+ Bệnh nhân'),
      h('button', { onclick: () => go('import') }, 'Nhập dữ liệu cũ')),
    h('section', { class: 'card' }, h('h3', {}, 'Bệnh nhân'), q, results),
    h('section', { class: 'card' }, h('h3', {}, 'Tìm theo ngày khám'),
      h('div', { class: 'date-range' }, 'Từ', from, 'đến', to, h('button', { onclick: searchDates }, 'Lọc')), visitsBox));
  q.focus();
  doSearch();
}

/* ---------- dashboard (landing page) ---------- */
const CHART_COLOR = '#00897b'; // single series; passes dataviz validator (lightness, chroma, contrast) on white
const dayLabel = (d, today) => d === today ? 'Hôm nay' : d === addDaysStr(today, 1) ? 'Ngày mai' : fmtDate(d);
function addDaysStr(s, n) { const [y, m, d] = s.split('-').map(Number); const t = new Date(Date.UTC(y, m - 1, d + n)); return t.toISOString().slice(0, 10); }

function statTile(label, value, sub, onclick, tone) {
  return h(onclick ? 'button' : 'div', { class: 'stat' + (tone ? ' ' + tone : ''), onclick },
    h('div', { class: 'stat-label' }, label), h('div', { class: 'stat-value' }, value), sub ? h('div', { class: 'stat-sub' }, sub) : null);
}

/** Single-series column chart (one axis), value label on the current month, tap/hover shows the rest. */
function monthChart(monthly, key, unitFmt) {
  const max = Math.max(1, ...monthly.map(m => m[key]));
  const step = niceStep(max / 2);
  const top = Math.max(step * 2, step * Math.ceil(max / step));
  const caption = h('div', { class: 'chart-cap' }, 'Chạm vào cột để xem số liệu');
  const ticks = [0, top / 2, top].map(t => h('div', { class: 'grid-line', style: `bottom:${t / top * 100}%` }, h('span', {}, unitFmt(t))));
  const bars = monthly.map((m, i) => {
    const [y, mo] = m.month.split('-');
    const text = `Tháng ${Number(mo)}/${y}: ${m[key]} lần khám`;
    const show = () => { caption.textContent = text; cols.forEach(c => c.classList.remove('sel')); col.classList.add('sel'); };
    const isLast = i === monthly.length - 1;
    const col = h('button', { class: 'col', 'aria-label': text, onclick: show, onmouseenter: show },
      h('div', { class: 'col-plot' },
        h('div', { class: 'bar-wrap', style: `height:${m[key] / top * 100}%` },
          isLast ? h('span', { class: 'col-val' }, unitFmt(m[key])) : null,
          h('i', { style: `background:${CHART_COLOR}` }))),
      h('div', { class: 'col-x' }, 'T' + Number(mo)));
    return col;
  });
  const cols = bars;
  return h('div', {}, h('div', { class: 'chart' }, h('div', { class: 'grid' }, ticks), h('div', { class: 'cols' }, bars)), caption);
}
function niceStep(x) {
  if (x <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(x)));
  return [1, 2, 5, 10].map(k => k * p).find(v => v >= x);
}

async function pageDashboard() {
  const search = h('input', { type: 'search', class: 'search', placeholder: '🔍 Tìm bệnh nhân: tên, mã, SĐT, CCCD…', autocomplete: 'off',
    onkeydown: e => { if (e.key === 'Enter') { pendingQuery = search.value; go('patients'); } } });
  const quota = h('div', { class: 'quota' });
  const shell = h('div', {}, h('div', { class: 'loading' }, 'Đang tải tổng quan…'));
  mount(
    h('section', { class: 'card' }, search,
      h('div', { class: 'row-actions', style: 'margin:0' },
        h('button', { class: 'primary', onclick: () => go('p/new') }, '+ Bệnh nhân'),
        h('button', { onclick: () => newAppointment() }, '+ Lịch hẹn'),
        h('button', { onclick: () => openCalendar() }, 'Lịch hẹn'),
        h('button', { onclick: () => go('import') }, 'Nhập dữ liệu cũ'))),
    shell, quota);

  let d;
  try { d = await api('getDashboard'); } catch (e) { return shell.replaceChildren(errBox(e, pageDashboard)); }
  const s = d.stats;
  const [y, m, dd] = d.today.split('-');
  const listOrEmpty = (items, empty) => items.length ? items : [h('div', { class: 'muted', style: 'padding:6px' }, empty)];


  shell.replaceChildren(
    h('div', { class: 'dash-date' }, `Hôm nay ${dd}/${m}/${y}`),
    h('div', { class: 'stats' },
      statTile('Khám hôm nay', s.visitsToday, s.visitsToday ? 'lần khám' : 'chưa có'),
      statTile('Hẹn hôm nay', s.apptToday, `${s.appt7} hẹn trong 7 ngày`, () => openCalendar('day', d.today)),
      statTile('Khám tháng này', s.visitsMonth, 'lần khám'),
      statTile('Tổng bệnh nhân', s.patients, s.newPatientsMonth ? `+${s.newPatientsMonth} mới tháng này` : 'hồ sơ', () => go('patients'))),
    h('div', { class: 'dash-grid' },
      h('section', { class: 'card', id: 'dash-appt' },
        h('div', { class: 'visit-head' }, h('h3', { style: 'margin:0' }, `Lịch hẹn 7 ngày tới (${d.upcoming.length})`),
          h('button', { onclick: () => openCalendar('week', d.today) }, 'Mở lịch')),
        h('div', { class: 'list' }, listOrEmpty(d.upcoming.map(a => avRow(a, () => openCalendar('day', a.appt_date),
          h('div', {}, h('span', { class: 'badge' + (a.appt_date === d.today ? ' red' : ''), style: 'margin:0 6px 0 0' }, dayLabel(a.appt_date, d.today)),
            h('b', { class: 'tnum' }, a.start_time || '—'), ' ', h('b', {}, a.full_name),
            a.status === 'arrived' ? h('span', { class: 'badge' }, '✓ Đã đến') : null),
          h('div', { class: 'muted' }, [a.start_time ? a.duration_min + ' phút' : 'chưa đặt giờ', a.title, phonesOf(a)[0]].filter(Boolean).join(' · ')))), 'Không có lịch hẹn'))),
      h('section', { class: 'card' }, h('h3', {}, `Khám hôm nay (${d.todayVisits.length})`),
        h('div', { class: 'list' }, listOrEmpty(d.todayVisits.map(v => avRow(v, () => go('p/' + v.patient_id),
          h('div', {}, h('b', {}, v.full_name), v.reason ? ' · ' + v.reason : ''), v.diagnosis ? h('div', { class: 'muted' }, v.diagnosis) : null)),
          'Chưa có lần khám nào hôm nay'))),
      h('section', { class: 'card' }, h('h3', {}, 'Lần khám 6 tháng gần nhất'), monthChart(d.monthly, 'visits', String)),
      h('section', { class: 'card' }, h('h3', {}, `Lỡ hẹn 30 ngày qua (${s.missed30})`),
        h('div', { class: 'muted', style: 'margin-top:-4px' }, 'Bệnh nhân không đến — nên gọi hẹn lại'),
        h('div', { class: 'list' }, listOrEmpty(d.missed.map(a => avRow(a, () => go('p/' + a.patient_id),
          h('div', {}, h('b', {}, a.full_name), ' ', h('span', { class: 'muted' }, phonesOf(a).join(' · '))),
          h('div', { class: 'muted' }, ['✗ ' + fmtDate(a.appt_date), a.start_time, a.title].filter(Boolean).join(' · ')))), 'Không có ai lỡ hẹn')),
        s.missed30 > d.missed.length ? h('div', { class: 'muted' }, `Hiển thị 10/${s.missed30} gần nhất`) : null)));

  api('getStorageQuota').then(q => {
    const pct = Math.round(q.ratio * 100);
    quota.className = 'quota' + (q.ratio > 0.8 ? ' warn' : '');
    quota.replaceChildren(`Dung lượng Drive: ${fmtSize(q.used)} / ${q.limit ? fmtSize(q.limit) : 'không giới hạn'} (${pct}%)`
      + (q.ratio > 0.8 ? ' — sắp đầy, cần dọn hoặc mua thêm dung lượng' : ''),
      h('div', { class: 'bar' }, h('i', { style: `width:${Math.min(pct, 100)}%` })));
  }).catch(() => {});
}

/* ---------- patient ---------- */
const kv = pairs => h('dl', { class: 'kv' }, pairs.filter(x => x[1] !== '' && x[1] != null).map(([k, v]) => [h('dt', {}, k), h('dd', {}, v)]));

/** Patient record with 3 tabs: Lịch sử khám · Hình ảnh · Thông tin. */
async function pagePatient(id, tab = 'history', labelFilter = '') {
  loading();
  let data;
  try { data = await api('getPatient', id); } catch (e) { return mount(errBox(e, () => pagePatient(id, tab))); }
  const p = data.patient;
  data.visits.forEach(v => v.images.forEach(i => { i.visit_date = v.visit_date; }));
  const allImages = data.visits.flatMap(v => v.images);
  let current = tab, filter = labelFilter;
  const reload = () => pagePatient(id, current, filter);

  const tabDefs = [['history', `Lịch sử khám (${data.visits.length})`], ['images', `Hình ảnh (${allImages.length})`], ['info', 'Thông tin']];
  const tabBtns = {};
  const body = h('div');
  const show = k => {
    current = k;
    Object.entries(tabBtns).forEach(([kk, b]) => b.classList.toggle('active', kk === k));
    body.replaceChildren(...(k === 'history' ? historyTab() : k === 'images' ? imagesTab() : infoTab()));
  };

  function historyTab() {
    if (!data.visits.length) return [h('div', { class: 'card muted' }, 'Chưa có lần khám — bấm "+ Lần khám".')];
    return data.visits.map((v, idx) => {
      const grid = thumbGrid(v.images, reload);
      const det = h('details', { class: 'card visit', open: idx === 0,
        ontoggle: () => { if (det.open && !det.dataset.loaded) { det.dataset.loaded = '1'; loadThumbs(v.images); } } },
        h('summary', {},
          h('div', { class: 'visit-sum' },
            h('b', {}, fmtDate(v.visit_date)), v.reason ? ' · ' + v.reason : '',
            v.images.length ? h('span', { class: 'badge' }, '📷 ' + v.images.length) : null,
            v.source !== 'app' ? h('span', { class: 'badge' }, 'Dữ liệu cũ') : null),
          v.diagnosis ? h('div', { class: 'muted' }, v.diagnosis) : null),
        kv([['Chẩn đoán', v.diagnosis], ['Răng', v.teeth], ['Điều trị', v.treatment], ['Kế hoạch', v.plan],
          ['Đơn thuốc', v.prescription], ['Hẹn tái khám', v.appointment ? fmtDate(v.appointment.appt_date) + ' · ' + apptTimeText(v.appointment) : ''], ['Ghi chú', v.notes]]),
        grid || h('div', { class: 'muted' }, 'Chưa có ảnh'),
        h('div', { class: 'row-actions', style: 'margin-top:8px' }, h('button', { onclick: () => go('v/' + v.visit_id) }, 'Sửa / thêm ảnh')));
      if (idx === 0) { det.dataset.loaded = '1'; setTimeout(() => loadThumbs(v.images)); }
      return det;
    });
  }

  function imagesTab() {
    if (!allImages.length) return [h('div', { class: 'card muted' }, 'Chưa có ảnh nào. Thêm ảnh trong từng lần khám.')];
    const count = k => allImages.filter(i => !k || i.label === k).length;
    const chips = h('div', { class: 'chips' }, [['', 'Tất cả'], ...Object.entries(LABELS)].map(([k, label]) =>
      count(k) ? h('button', { class: 'chip' + (filter === k ? ' active' : ''), onclick: () => { filter = k; show('images'); } }, `${label} (${count(k)})`) : null));
    const list = allImages.filter(i => !filter || i.label === filter); // lightbox swipes across all visits
    const groups = data.visits.map(v => ({ v, imgs: list.filter(i => i.visit_id === v.visit_id) })).filter(g => g.imgs.length);
    const out = [chips, ...groups.map(g => h('section', { class: 'card' },
      h('div', { class: 'visit-head' },
        h('div', {}, h('b', {}, fmtDate(g.v.visit_date)), g.v.reason ? ' · ' + g.v.reason : '', h('span', { class: 'muted' }, ` (${g.imgs.length})`)),
        h('button', { onclick: () => go('v/' + g.v.visit_id) }, 'Lần khám')),
      thumbGrid(g.imgs, reload, list, list.indexOf(g.imgs[0]))))];
    setTimeout(() => loadThumbs(list));
    return out;
  }

  function infoTab() {
    return [h('section', { class: 'card' },
      kv([['Mã BN', p.patient_id], ['Số CCCD', p.national_id], ['Ngày sinh', p.dob ? fmtDate(p.dob) : (p.birth_year || '')], ['Giới tính', p.gender],
        ['SĐT', phonesOf(p).join('\n')],
        ['Địa chỉ', p.address], ['Dị ứng', p.allergies], ['Bệnh toàn thân', p.systemic_diseases], ['Thuốc đang dùng', p.current_meds],
        ['Ghi chú', p.notes]]),
      h('div', { class: 'row-actions' },
        h('button', { onclick: () => go('p/' + id + '/edit') }, 'Sửa thông tin'),
        h('button', { class: 'danger', onclick: async () => {
          if (!confirm(`Xoá hồ sơ ${p.full_name} (${p.patient_id})? Dữ liệu vẫn còn trong Google Sheet/Drive.`)) return;
          try { await api('deletePatient', id); toast('Đã xoá hồ sơ'); go('patients'); } catch (e) { toast(errMsg(e), 'error'); }
        } }, 'Xoá hồ sơ')))];
  }

  mount(
    h('div', { class: 'row-actions' }, h('button', { onclick: () => go('patients') }, '← Danh sách')),
    h('section', { class: 'card' },
      h('div', { class: 'p-head' }, avatar(p, 72),
        h('div', { class: 'row-main' },
          h('div', { class: 'visit-head' }, h('h2', {}, p.full_name), h('span', { class: 'badge' }, p.patient_id)),
          h('div', { class: 'muted' }, [p.dob ? fmtDate(p.dob) : (p.birth_year ? 'Sinh ' + p.birth_year : ''), p.gender].filter(Boolean).join(' · ')),
          p.national_id ? h('div', { class: 'muted' }, 'CCCD ' + p.national_id) : null,
          phonesOf(p).length ? h('div', { class: 'muted' }, '☎ ' + phonesOf(p).join(' · ')) : null)),
      p.allergies ? h('div', { class: 'alert' }, '⚠ Dị ứng: ' + p.allergies) : null,
      p.systemic_diseases ? h('div', { class: 'muted' }, 'Bệnh toàn thân: ' + p.systemic_diseases) : null,
      data.appointments.length ? h('div', { class: 'appt-line' }, data.appointments.slice(0, 3).map(a =>
        h('button', { class: 'ev st-' + a.status + ' appt-chip', onclick: () => openCalendar('day', a.appt_date) },
          '📅 ' + dayLabel(a.appt_date, todayStr()) + ' ' + (a.start_time ? a.start_time + ` (${a.duration_min}')` : '(chưa đặt giờ)') + (a.title ? ' · ' + a.title : '')))) : null,
      h('div', { class: 'row-actions', style: 'margin:8px 0 0' },
        h('button', { class: 'primary', onclick: () => go('p/' + id + '/v/new') }, '+ Lần khám'),
        h('button', { onclick: () => newAppointment({ patient_id: id }) }, '+ Lịch hẹn'))),
    h('div', { class: 'tabs' }, tabDefs.map(([k, label]) => (tabBtns[k] = h('button', { class: 'tab', onclick: () => show(k) }, label)))),
    body);
  show(current);
}

/* ---------- thumbnails & lightbox ---------- */
const thumbEls = new Map();
const thumbCache = new Map(); // image_id → data URL, so switching tabs does not refetch
/** `list`/`offset`: the lightbox swipes through `list` (e.g. all photos of the patient), starting at offset + i. */
function thumbGrid(images, onChanged, list = images, offset = 0) {
  if (!images.length) return null;
  return h('div', { class: 'thumbs' }, images.map((img, i) => {
    const box = thumbCache.has(img.image_id) ? h('img', { src: thumbCache.get(img.image_id), alt: '' }) : h('div', { class: 'ph' }, '🖼');
    thumbEls.set(img.image_id, box);
    return h('button', { class: 'thumb', title: img.file_name, onclick: () => openLightbox(list, offset + i, onChanged) },
      box, h('span', { class: 'lbl' }, LABELS[img.label] || ''));
  }));
}
async function loadThumbs(images, attempt = 0) {
  const ids = images.map(i => i.image_id).filter(id => !thumbCache.has(id));
  const missing = [];
  for (let i = 0; i < ids.length; i += 20) {
    const batch = ids.slice(i, i + 20);
    let res;
    try { res = await api('getThumbs', batch); } catch (e) { continue; }
    for (const id of batch) {
      const box = thumbEls.get(id);
      if (!box || !box.isConnected) continue;
      if (res[id]) { thumbCache.set(id, res[id]); box.replaceWith(h('img', { src: res[id], alt: '' })); }
      else missing.push(images.find(x => x.image_id === id));
    }
  }
  // Drive needs a few seconds to generate thumbnails for fresh uploads.
  if (missing.length && attempt < 3) setTimeout(() => loadThumbs(missing, attempt + 1), 6000 * (attempt + 1));
}

function openLightbox(images, index, onChanged) {
  let i = index;
  const img = h('img', { alt: '' });
  const status = h('div', { class: 'muted' }, '');
  const name = h('span', { class: 'grow' });
  const label = h('select', { onchange: async () => {
    try { await api('setImageLabel', images[i].image_id, label.value); images[i].label = label.value; toast('Đã đổi nhãn'); changed = true; }
    catch (e) { toast(errMsg(e), 'error'); }
  } });
  const original = h('a', { class: 'btn', target: '_blank', rel: 'noopener' }, 'Bản gốc');
  let changed = false;
  const cache = new Map();
  async function show() {
    const cur = images[i];
    name.textContent = [`${i + 1}/${images.length}`, cur.visit_date ? 'Khám ' + fmtDate(cur.visit_date) : '', cur.file_name, fmtSize(cur.size_bytes)].filter(Boolean).join(' · ');
    label.replaceChildren(...labelOptions(cur.label));
    original.href = 'https://drive.google.com/file/d/' + encodeURIComponent(cur.image_id) + '/view';
    img.removeAttribute('src'); status.textContent = 'Đang tải ảnh…';
    try {
      if (!cache.has(cur.image_id)) cache.set(cur.image_id, await api('getPreview', cur.image_id));
      if (images[i] !== cur) return;
      const src = cache.get(cur.image_id);
      if (src) { img.src = src; status.textContent = ''; }
      else status.textContent = 'Drive chưa tạo xong bản xem trước — bấm "Bản gốc" để xem.';
    } catch (e) { status.textContent = errMsg(e); }
  }
  const move = d => { i = (i + d + images.length) % images.length; show(); };
  const close = () => { box.remove(); document.removeEventListener('keydown', onKey); if (changed && onChanged) onChanged(); };
  const onKey = e => { if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft') move(-1); if (e.key === 'ArrowRight') move(1); };
  let touchX = null;
  const box = h('div', { class: 'lightbox' },
    h('div', { class: 'lb-top' }, name, label, original,
      h('button', { class: 'danger', onclick: async () => {
        if (!confirm('Xoá ảnh này? Ảnh gốc vào Thùng rác Drive (khôi phục được 30 ngày).')) return;
        try {
          await api('deleteImage', images[i].image_id);
          images.splice(i, 1); changed = true; toast('Đã xoá ảnh');
          if (!images.length) return close();
          i = Math.min(i, images.length - 1); show();
        } catch (e) { toast(errMsg(e), 'error'); }
      } }, 'Xoá'),
      h('button', { onclick: close }, '✕')),
    h('div', { class: 'lb-img',
      ontouchstart: e => { touchX = e.touches[0].clientX; },
      ontouchend: e => { if (touchX == null) return; const dx = e.changedTouches[0].clientX - touchX; if (Math.abs(dx) > 50) move(dx > 0 ? -1 : 1); touchX = null; } },
      img),
    status,
    images.length > 1 ? h('button', { class: 'nav prev', onclick: () => move(-1) }, '‹') : null,
    images.length > 1 ? h('button', { class: 'nav next', onclick: () => move(1) }, '›') : null);
  document.body.append(box);
  document.addEventListener('keydown', onKey);
  show();
}

/* ---------- forms ---------- */
function formFields(defs, values) {
  const inputs = {};
  const els = defs.map(d => {
    const attrs = { name: d.name, value: values[d.name] == null ? '' : values[d.name], oninput: () => { dirty = true; } };
    let el;
    if (d.type === 'textarea') { el = h('textarea', attrs); }
    else if (d.type === 'select') { el = h('select', { ...attrs, onchange: attrs.oninput }, d.options.map(o => h('option', { value: o, selected: o === values[d.name] }, o || '—'))); }
    else el = h('input', { type: d.type || 'text', ...attrs, inputmode: d.inputmode, min: d.min, required: d.required });
    inputs[d.name] = el;
    return h('div', { class: d.full ? 'full' : '' }, h('label', {}, d.label + (d.required ? ' *' : '')), el);
  });
  return { el: h('div', { class: 'grid-form' }, els), data: () => Object.fromEntries(Object.entries(inputs).map(([k, el]) => [k, el.value])), inputs };
}

/** Several phone numbers: one input each, "+ Thêm số". */
function phoneList(value) {
  const box = h('div', { class: 'phones' });
  const addRow = v => {
    const inp = h('input', { type: 'tel', inputmode: 'tel', value: v || '', placeholder: '09xx xxx xxx', oninput: () => { dirty = true; } });
    const row = h('div', { class: 'phone-row' }, inp, h('button', { type: 'button', 'aria-label': 'Xoá số', onclick: () => { row.remove(); dirty = true; if (!box.querySelector('input')) addRow(''); } }, '✕'));
    box.insertBefore(row, addBtn);
  };
  const addBtn = h('button', { type: 'button', class: 'link-btn', onclick: () => addRow('') }, '+ Thêm số điện thoại');
  box.append(addBtn);
  const list = String(value || '').split(',').map(x => x.trim()).filter(Boolean);
  (list.length ? list : ['']).forEach(addRow);
  return { el: box, value: () => [...box.querySelectorAll('input')].map(i => i.value.trim()).filter(Boolean).join(', ') };
}

async function pagePatientForm(id) {
  let p = {};
  if (id) {
    loading();
    try { p = (await api('getPatient', id)).patient; } catch (e) { return mount(errBox(e, () => pagePatientForm(id))); }
  }
  // Portrait: compressed in the browser, uploaded after the patient is saved.
  let newAvatar = null; // { blob, dataUrl }
  const avBox = h('div', { class: 'av-edit' }, avatar(p.patient_id ? p : { full_name: p.full_name || '?' }, 96));
  const avInput = h('input', { type: 'file', accept: 'image/*', class: 'hidden', onchange: async () => {
    const file = avInput.files[0];
    avInput.value = '';
    if (!file) return;
    const blob = await compressImage(file, 640, 0.85);
    const dataUrl = await blobToDataUrl(blob);
    newAvatar = { blob, dataUrl };
    dirty = true;
    avBox.replaceChildren(h('span', { class: 'avatar', style: 'width:96px;height:96px' }, h('img', { src: dataUrl, alt: '' })));
  } });
  const f = formFields([
    { name: 'full_name', label: 'Họ tên', required: true, full: true },
    { name: 'national_id', label: 'Số CCCD (12 số)', inputmode: 'numeric' },
    { name: 'gender', label: 'Giới tính', type: 'select', options: ['', 'Nam', 'Nữ'] },
    { name: 'dob', label: 'Ngày sinh', type: 'date' },
    { name: 'birth_year', label: 'Năm sinh (nếu không rõ ngày)', type: 'number', inputmode: 'numeric' },
    { name: 'address', label: 'Địa chỉ', full: true },
    { name: 'allergies', label: 'Dị ứng', type: 'textarea' },
    { name: 'systemic_diseases', label: 'Bệnh toàn thân', type: 'textarea' },
    { name: 'current_meds', label: 'Thuốc đang dùng', type: 'textarea' },
    { name: 'notes', label: 'Ghi chú', type: 'textarea' },
  ], p);
  f.inputs.national_id.maxLength = 15;
  const phones = phoneList(p.phone);
  f.el.insertBefore(h('div', { class: 'full' }, h('label', {}, 'Số điện thoại (có thể nhiều số)'), phones.el), f.inputs.address.parentNode);
  const save = h('button', { class: 'primary', onclick: async () => {
    const d = f.data();
    if (!d.full_name.trim()) return toast('Thiếu họ tên', 'warn');
    const cccd = d.national_id.replace(/[\s.-]/g, '');
    if (cccd && !/^\d{12}$/.test(cccd)) return toast('Số CCCD phải gồm đúng 12 chữ số', 'warn');
    d.phone = phones.value();
    if (id) d.patient_id = id;
    save.disabled = true;
    try {
      const pid = await api('savePatient', d);
      if (newAvatar) {
        save.textContent = 'Đang tải ảnh…';
        try {
          const ctx = await api('getAvatarUploadContext', pid);
          const file = await sendToDrive({ file: new File([newAvatar.blob], `avatar_${pid}_${Date.now()}.jpg`, { type: newAvatar.blob.type || 'image/jpeg' }), setProgress() {} }, ctx);
          await api('setPatientAvatar', pid, file.id);
          thumbCache.set(file.id, newAvatar.dataUrl); // show immediately; Drive thumbnail may lag
        } catch (e) { toast('Đã lưu hồ sơ nhưng chưa tải được ảnh: ' + errMsg(e), 'error'); }
      }
      dirty = false; toast('Đã lưu'); go('p/' + pid);
    } catch (e) { toast(errMsg(e), 'error'); save.disabled = false; save.textContent = 'Lưu'; }
  } }, 'Lưu');
  mount(h('section', { class: 'card' }, h('h2', {}, id ? 'Sửa thông tin ' + p.patient_id : 'Bệnh nhân mới'),
    h('div', { class: 'av-row' }, avBox,
      h('div', {}, h('button', { type: 'button', onclick: () => avInput.click() }, p.avatar_id ? '📷 Đổi ảnh chân dung' : '📷 Chụp / chọn ảnh chân dung'),
        h('div', { class: 'muted', style: 'margin-top:4px' }, 'Ảnh làm đại diện hồ sơ, tự thu nhỏ trước khi lưu')), avInput),
    f.el,
    h('div', { class: 'row-actions', style: 'margin-top:12px' }, save, h('button', { onclick: () => go(id ? 'p/' + id : 'patients') }, 'Huỷ'))));
  f.inputs.full_name.focus();
}

async function pageVisitForm({ patientId, visitId }) {
  loading();
  let visit = { visit_date: todayStr() }, patient, images = [];
  try {
    if (visitId) { const r = await api('getVisit', visitId); visit = r.visit; patient = r.patient; images = r.visit.images; }
    else patient = (await api('getPatient', patientId)).patient;
  } catch (e) { return mount(errBox(e, () => pageVisitForm({ patientId, visitId }))); }
  patientId = patient.patient_id;

  const f = formFields([
    { name: 'visit_date', label: 'Ngày khám', type: 'date', required: true },
    { name: 'teeth', label: 'Răng liên quan (FDI, VD 16, 46)', inputmode: 'numeric' },
    { name: 'reason', label: 'Lý do khám', full: true },
    { name: 'diagnosis', label: 'Chẩn đoán', type: 'textarea' },
    { name: 'treatment', label: 'Điều trị đã làm', type: 'textarea' },
    { name: 'plan', label: 'Kế hoạch tiếp', type: 'textarea' },
    { name: 'prescription', label: 'Đơn thuốc', type: 'textarea' },
    { name: 'notes', label: 'Ghi chú', type: 'textarea' },
  ], visit);

  const existing = h('div', {}, thumbGrid(images, () => go('v/' + visitId, false)));

  // Follow-up appointment booked during this visit (creates/updates the linked appointment).
  const ap = visit.appointment || {};
  const apDate = h('input', { type: 'date', value: ap.appt_date || '', oninput: () => { dirty = true; } });
  const apTime = h('input', { type: 'time', value: ap.start_time || '', step: 300, oninput: () => { dirty = true; } });
  let apDur = ap.duration_min ? String(ap.duration_min) : '';
  const apDurPick = durationPicker(apDur, v => { apDur = v; dirty = true; });
  const apTitle = h('input', { value: ap.title || '', placeholder: 'Mặc định lấy theo "Kế hoạch tiếp"', oninput: () => { dirty = true; } });
  const apSection = h('section', { class: 'card' }, h('h3', {}, 'Hẹn tái khám'),
    ap.appt_id ? h('div', { class: 'muted' }, `Đã có lịch hẹn (${(APPT_STATUS[ap.status] || {}).label || ''}) — sửa ở đây hoặc trên Lịch hẹn.`) : null,
    h('div', { class: 'grid-form' },
      h('div', {}, h('label', {}, 'Ngày hẹn'), apDate), h('div', {}, h('label', {}, 'Giờ (để trống nếu chưa chốt)'), apTime),
      h('div', { class: 'full' }, h('label', {}, 'Thời lượng dự kiến'), apDurPick.el),
      h('div', { class: 'full' }, h('label', {}, 'Nội dung hẹn'), apTitle)));
  const uploader = createUploader({
    getVisitId: () => visitId,
    onUploaded: imgs => {
      images.push(...imgs);
      existing.replaceChildren(thumbGrid(images, () => go('v/' + visitId, false)) || '');
      loadThumbs(imgs);
    },
  });

  const title = h('h2', {}, visitId ? 'Sửa lần khám' : 'Lần khám mới');
  const save = h('button', { class: 'primary', onclick: doSave }, 'Lưu');
  async function doSave() {
    const d = f.data();
    if (!d.visit_date) return toast('Thiếu ngày khám', 'warn');
    save.disabled = true;
    try {
      if (apDate.value && apTime.value && !apDur) { save.disabled = false; return toast('Nhập thời lượng dự kiến cho lịch hẹn', 'warn'); }
      const appointment = apDate.value ? { appt_date: apDate.value, start_time: apTime.value, duration_min: apDur,
        title: apTitle.value || d.plan || 'Tái khám' } : null;
      const id = await api('saveVisit', { ...d, visit_id: visitId, patient_id: patientId, appointment });
      dirty = false;
      if (!visitId) { // stay on this page as "edit" so queued photos keep their progress
        visitId = id;
        title.textContent = 'Sửa lần khám';
        google.script.history.replace({ path: 'v/' + id }, null, 'v/' + id);
      }
      if (uploader.pendingCount()) {
        toast('Đã lưu, đang tải ảnh…');
        const r = await uploader.startAll();
        if (r.failed) { save.disabled = false; return toast(`${r.failed} ảnh lỗi — bấm "Tải lại ảnh lỗi"`, 'error'); }
      }
      toast('Đã lưu');
      go('p/' + patientId);
    } catch (e) { toast(errMsg(e), 'error'); save.disabled = false; }
  }

  mount(
    h('div', { class: 'row-actions' }, h('button', { onclick: () => go('p/' + patientId) }, '← ' + patient.full_name)),
    patient.allergies ? h('div', { class: 'alert' }, '⚠ Dị ứng: ' + patient.allergies) : null,
    h('section', { class: 'card' }, title,
      h('div', { class: 'row-av', style: 'margin-bottom:8px' }, avatar(patient, 40), h('div', { class: 'row-main' }, h('b', {}, patient.full_name), h('div', { class: 'muted' }, patient.patient_id))),
      f.el),
    h('section', { class: 'card' }, h('h3', {}, 'Ảnh chụp'), existing, uploader.el),
    apSection,
    h('div', { class: 'row-actions' }, save, h('button', { onclick: () => go('p/' + patientId) }, 'Huỷ'),
      visitId ? h('button', { class: 'danger', onclick: async () => {
        if (!confirm('Xoá lần khám này?')) return;
        try { await api('deleteVisit', visitId); toast('Đã xoá lần khám'); dirty = false; go('p/' + patientId); } catch (e) { toast(errMsg(e), 'error'); }
      } }, 'Xoá lần khám') : null));
  loadThumbs(images);
}
</script>
