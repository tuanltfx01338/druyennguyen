<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0F1E3D">
  <title>Sổ bệnh án Nha khoa</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0F1E3D; color:#fff;
      font:16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding:24px; }
    main { width:100%; max-width:380px; text-align:center; }
    .logo { width:72px; height:72px; margin:0 auto 18px; border-radius:20px; background:#2457F5; display:flex; align-items:center; justify-content:center; }
    h1 { font-size:24px; margin:0 0 6px; }
    p { color:#C7D0E2; margin:0 0 22px; font-size:15px; }
    a.open { display:block; background:#2457F5; color:#fff; text-decoration:none; font-weight:700; font-size:17px; padding:15px; border-radius:14px; }
    a.open:focus-visible { outline:3px solid #9FB4FF; outline-offset:3px; }
    .hint { margin-top:18px; font-size:13px; color:#8A95A8; }
    .err { color:#FFC46B; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.2c-3 0-5 2.2-5 5.4 0 3 1.4 4.4 2 7 .6 2.9 1.2 5.2 2.5 5.2 1.6 0 1.6-4.8 4.5-4.8s2.9 4.8 4.5 4.8c1.3 0 1.9-2.3 2.5-5.2.6-2.6 2-4 2-7 0-3.2-2-5.4-5-5.4-1.8 0-2.6.9-4 .9s-2.2-.9-4-.9z"/></svg>
    </div>
    <h1>Sổ bệnh án Nha khoa</h1>
    <p id="msg">Đang mở app…</p>
    <a class="open" id="open" href="#">Mở Sổ bệnh án</a>
    <div class="hint">Đăng nhập bằng tài khoản Google của bác sĩ.<br>Thêm trang này vào màn hình chính để mở nhanh.</div>
  </main>
  <script>
    // __APP_URL__ is replaced by .github/workflows/pages.yml with the repository variable APP_URL
    // (the Apps Script web-app /exec link). Only that Google URL is accepted.
    var APP_URL = '__APP_URL__';
    var ok = /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(APP_URL);
    var a = document.getElementById('open');
    if (ok) {
      a.href = APP_URL;
      location.replace(APP_URL);
    } else {
      a.style.display = 'none';
      var m = document.getElementById('msg');
      m.className = 'err';
      m.textContent = 'Chưa cấu hình link app (biến APP_URL trong GitHub).';
    }
  </script>
</body>
</html>
